<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>예산 AI 분석</title>
<style>
:root{--bg:#f6f7fb;--card:#fff;--ink:#1d2330;--sub:#6b7385;--line:#e3e6ef;--accent:#2f4fb8;--warn:#c2410c;--ok:#15803d;--note-bg:#eef2ff;--note-ink:#2f3a6b}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#12151c;--card:#1b2030;--ink:#e8ebf3;--sub:#9aa3b8;--line:#2a3144;--accent:#7b96ff;--warn:#fb923c;--ok:#4ade80;--note-bg:#1f2747;--note-ink:#c9d3ff}}
:root[data-theme="dark"]{--bg:#12151c;--card:#1b2030;--ink:#e8ebf3;--sub:#9aa3b8;--line:#2a3144;--accent:#7b96ff;--warn:#fb923c;--ok:#4ade80;--note-bg:#1f2747;--note-ink:#c9d3ff}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.6 system-ui,-apple-system,"Malgun Gothic",sans-serif}
header{padding:20px 16px 8px;max-width:960px;margin:auto}
h1{font-size:20px;margin:0}
.notice{margin:8px 0 0;padding:8px 12px;border-radius:8px;background:var(--note-bg);color:var(--note-ink);font-size:13px}
nav{display:flex;gap:6px;overflow-x:auto;padding:12px 16px;max-width:960px;margin:auto;scrollbar-width:none}
nav button{flex:none;border:1px solid var(--line);background:var(--card);color:var(--ink);padding:8px 12px;border-radius:999px;cursor:pointer;font-size:14px}
nav button.on{background:var(--accent);color:#fff;border-color:var(--accent)}
main{max-width:960px;margin:auto;padding:0 16px 24px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px;margin-bottom:14px}
.card h2{font-size:16px;margin:0 0 10px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px}
.kpi b{display:block;font-size:20px}
.kpi span{color:var(--sub);font-size:13px}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{padding:8px 6px;border-bottom:1px solid var(--line);text-align:right}
th:first-child,td:first-child{text-align:left}
input,select{width:100%;padding:10px;border-radius:8px;border:1px solid var(--line);background:var(--bg);color:var(--ink);font-size:15px}
.row{display:flex;gap:8px;flex-wrap:wrap}
.row>*{flex:1 1 200px}
button.go{padding:10px 16px;border-radius:8px;border:0;background:var(--accent);color:#fff;cursor:pointer;font-size:15px}
.tag{display:inline-block;font-size:12px;padding:2px 8px;border-radius:999px;border:1px solid var(--line);color:var(--sub);margin:2px 4px 2px 0}
.warn{color:var(--warn)} .ok{color:var(--ok)} .sub{color:var(--sub);font-size:13px}
.bar{height:8px;background:var(--line);border-radius:4px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent)}
.doc{border-left:3px solid var(--accent);padding:6px 10px;margin:8px 0;background:var(--bg);border-radius:6px;font-size:14px}
.item{padding:8px 0;border-bottom:1px solid var(--line)}
.item a{color:var(--accent);text-decoration:none;font-weight:600}
svg text{fill:var(--sub);font-size:11px}
footer{max-width:960px;margin:auto;padding:8px 16px 40px;color:var(--sub);font-size:12px}
.logo{font-family:"D-DIN","DIN Alternate","Bahnschrift","Arial Narrow",sans-serif;font-weight:700;letter-spacing:.18em;color:var(--ink);font-size:13px;text-decoration:none}
.logo sup{color:#d0342c;font-size:12px;margin-left:1px}
</style>
</head>
<body>
<header>
  <h1>예산 AI 분석</h1>
  <div class="notice" id="notice"></div>
</header>
<nav id="tabs"></nav>
<main id="view"></main>
<footer>
  <a class="logo" href="https://github.com/lloydknam">LLOYD'S BALCONY LAB<sup>*</sup></a>
  <span> · with claude · <a href="https://github.com/lloydknam" style="color:inherit">GitHub(@lloydknam)</a></span>
  <div style="margin-top:2px">*아직 실험 중</div>
</footer>

<script src="data/budget.js"></script>
<script>
const D = window.BUDGET;
// 압축된 실데이터를 원래 구조로 풀기 (scripts/build.py 참고)
if (D.packed) {
  const { keys, years, dicts, rows } = D.packed;
  D.projects = rows.map((r, i) => {
    const p = { id: "B" + String(i + 1).padStart(5, "0"), exec: {}, docs: [], years: {} };
    keys.forEach((k, j) => p[k] = dicts[k][r[j]]);
    p.name = r[keys.length];
    years.forEach((y, j) => {
      const g = r[keys.length + 1 + j * 2], n = r[keys.length + 2 + j * 2];
      if (g != null || n != null) p.years[y] = { gov: g, na: n };
    });
    const extra = r[keys.length + 1 + years.length * 2];
    if (extra) Object.assign(p, extra);
    return p;
  });
  if (D.packed.units) {
    const ey = D.exec_years || [];
    D.units = D.packed.units.map(r => {
      const u = { ministry: dicts.ministry[r[0]], activity: r[1], program: r[2], funds: r[3] ? r[3].split(",") : [], years: {} };
      ey.forEach((y, j) => { const v = r[4 + j]; if (v) u.years[y] = { cur: v[0], spent: v[1], carry: v[2], unused: v[3], rate: v[0] > 0 ? v[1] / v[0] * 100 : null }; });
      return u;
    });
  }
  delete D.packed;
}
const U = D.units || [];
const P = D.projects;
const YEARS = [2024, 2025, 2026, 2027];
const CUR = 2027, PREV = 2026;
const SAMPLE = !D.source;

/* ---------- 공통 ---------- */
const won = n => n == null || isNaN(n) ? "-" : Number(n).toLocaleString("ko-KR", { maximumFractionDigits: 1 });
const jo = n => n == null || isNaN(n) ? "-" : (n / 10000).toLocaleString("ko-KR", { maximumFractionDigits: 1 }) + "조";
const pct = n => (n == null || !isFinite(n)) ? "-" : (n > 0 ? "+" : "") + n.toFixed(1) + "%";
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const Y = (p, y) => (p.years && p.years[y]) || { gov: null, na: null };
// 결산: 세부사업이 속한 단위사업 전체 실적 (열린재정 결산은 단위사업 단위)
const unitOf = p => (p.unit != null && U[p.unit]) || null;
const E = (p, y) => { const u = unitOf(p); const v = u && u.years[y]; return v ? { budget: v.cur, spent: v.spent, carry: v.carry, unused: v.unused, rate: v.rate } : (p.exec && p.exec[y]) || null; };
const EXEC_LAST = (D.exec_years || []).slice(-1)[0] || CUR - 2;
const idle = e => e && e.budget > 0 ? (e.carry + e.unused) / e.budget * 100 : null;  // 이월+불용 비율
// 연도별 대표값: 국회 확정이 있으면 확정, 없으면 정부안
const amt = (p, y) => { const v = Y(p, y); return v.na != null ? v.na : v.gov; };
const base = p => Y(p, PREV).na;           // 비교 기준: 전년도 국회 확정
const curGov = p => Y(p, CUR).gov;         // 올해 정부안
const diff = p => (curGov(p) || 0) - (base(p) || 0);
const chg = p => (base(p) > 0 && curGov(p) != null) ? curGov(p) / base(p) - 1 : NaN;
const isNew = p => !(base(p) > 0) && curGov(p) > 0;
const isGone = p => base(p) > 0 && !(curGov(p) > 0);
const HAS_EXEC = U.length > 0 || P.some(p => p.exec && Object.keys(p.exec).length);
const HAS_DOCS = P.some(p => p.docs && p.docs.length);
const label = p => `${esc(p.name)} <span class="sub">${esc(p.ministry)}${p.program ? " · " + esc(p.program) : ""}</span>`;
const link = p => `<a href="#" onclick="openProject('${p.id}');return false">${label(p)}</a>`;
const total = (y, k) => D.totals ? D.totals[y][k] : P.reduce((a, p) => a + (Y(p, y)[k] || 0), 0);

document.getElementById("notice").innerHTML = SAMPLE
  ? "화면 시험용 <b>샘플 데이터</b>입니다. 실제 예산 수치가 아닙니다."
  : `출처: 열린재정 Open API · 예산 ${YEARS[0]}~${CUR} (총지출 기준, 세부사업 ${P.length.toLocaleString()}개)${HAS_EXEC ? ` · 결산 ${(D.exec_years || [])[0]}~${EXEC_LAST} (단위사업 ${U.length.toLocaleString()}개)` : ""} · 단위 ${D.unit} · 수집 ${esc((D.fetched_at || "").slice(0, 10))}<br>
     국회 검토문서는 아직 연결 전입니다. 공식 시스템과 무관한 개인 프로젝트입니다.`;

const TABS = [["home", "홈"], ["overview", "한눈에 보기"], ["explore", "예산 탐색"], ["review", "심사 참고"],
  ["filter", "조건으로 찾기"], ["ask", "AI에게 묻기"], ["quality", "삶의 질 지표"]];
let cur = "home";
function drawTabs() {
  document.getElementById("tabs").innerHTML = TABS.map(([k, l]) =>
    `<button class="${k === cur ? "on" : ""}" onclick="go('${k}')">${l}</button>`).join("");
}
function go(k) { cur = k; drawTabs(); VIEWS[k](); window.scrollTo(0, 0); }
const VIEWS = {};
const view = html => document.getElementById("view").innerHTML = html;

function search(q, limit = 30) {
  const terms = q.trim().split(/\s+/).filter(Boolean);
  if (!terms.length) return [];
  return P.filter(p => {
    const hay = `${p.name} ${p.ministry} ${p.program || ""} ${p.activity || ""} ${p.field} ${(p.aka || []).join(" ")} ${(p.prev_ministry || []).join(" ")} ${p.pooled_from || ""}`;
    return terms.every(t => hay.includes(t));
  }).sort((a, b) => (curGov(b) || amt(b, PREV) || 0) - (curGov(a) || amt(a, PREV) || 0)).slice(0, limit);
}
const resultRow = p => `<div class="item">${link(p)}<br><span class="sub">${esc(p.field)} · ${CUR} 정부안 ${won(curGov(p))}억 · ${PREV} 확정 ${won(base(p))}억 · ${isNew(p) ? '<span class="warn">신규</span>' : pct(chg(p) * 100)}</span></div>`;

/* ---------- 1. 홈 ---------- */
VIEWS.home = () => {
  const g = total(CUR, "gov"), n = total(PREV, "na");
  const top = P.filter(p => base(p) > 0 && curGov(p) > 0).sort((a, b) => diff(b) - diff(a)).slice(0, 5);
  const cut = P.filter(p => base(p) > 0).sort((a, b) => diff(a) - diff(b)).slice(0, 5);
  view(`
  <div class="card"><h2>${CUR}년 예산안 규모·증감</h2>
    <div class="kpis">
      <div class="kpi"><span>${CUR} 정부안 총지출</span><b>${jo(g)}원</b></div>
      <div class="kpi"><span>${PREV} 국회 확정 대비</span><b class="${g > n ? "warn" : "ok"}">${pct((g / n - 1) * 100)}</b></div>
      <div class="kpi"><span>증감액</span><b>${jo(g - n)}원</b></div>
      <div class="kpi"><span>세부사업</span><b>${P.filter(p => curGov(p) > 0).length.toLocaleString()}개</b></div>
    </div></div>
  <div class="card"><h2>나라 살림 영수증 <span class="sub">(${CUR} 정부안, 분야별)</span></h2>${receipt()}</div>
  <div class="card"><h2>사업 검색</h2>
    <input id="q" placeholder="사업명·부처·프로그램 (예: 기초연금, 교육부 늘봄)" oninput="document.getElementById('qr').innerHTML = search(this.value).map(resultRow).join('') || (this.value.trim() ? '<div class=sub>결과 없음</div>' : '')">
    <div id="qr" style="margin-top:6px"></div></div>
  <div class="card"><h2>가장 많이 늘어난 사업 <span class="sub">(${PREV} 확정 → ${CUR} 정부안, 억원)</span></h2>
    ${top.map(p => `<div class="item">${link(p)}<br><span class="sub">${won(base(p))} → ${won(curGov(p))} (<span class="warn">+${won(diff(p))}</span>, ${pct(chg(p) * 100)})</span></div>`).join("")}</div>
  <div class="card"><h2>가장 많이 줄어든 사업</h2>
    ${cut.map(p => `<div class="item">${link(p)}<br><span class="sub">${won(base(p))} → ${won(curGov(p) || 0)} (<span class="ok">${won(diff(p))}</span>${isGone(p) ? ", 미편성" : ", " + pct(chg(p) * 100)})</span></div>`).join("")}</div>`);
};
function byField(y, pick) {
  const m = {};
  P.forEach(p => { const v = pick(p, y); if (v) m[p.field] = (m[p.field] || 0) + v; });
  return m;
}
function receipt() {
  const m = byField(CUR, (p, y) => Y(p, y).gov);
  const sum = Object.values(m).reduce((a, b) => a + b, 0);
  const rows = Object.entries(m).sort((a, b) => b[1] - a[1]);
  return `<table>${rows.map(([k, v]) => `<tr><td>${esc(k)}</td><td>${jo(v)}</td><td class="sub">${(v / sum * 100).toFixed(1)}%</td></tr>`).join("")}
    <tr><td><b>합계</b></td><td><b>${jo(sum)}</b></td><td></td></tr></table>`;
}

/* ---------- 2. 한눈에 보기 ---------- */
VIEWS.overview = () => {
  const g = byField(CUR, (p, y) => Y(p, y).gov), n = byField(PREV, (p, y) => Y(p, y).na);
  const rows = Object.keys({ ...g, ...n }).map(k => [k, g[k] || 0, n[k] || 0]).sort((a, b) => b[1] - a[1]);
  const max = Math.max(...rows.map(r => r[1]));
  const funds = {};
  P.forEach(p => { const v = curGov(p); if (v && p.fund) { const k = p.fund.split("/")[0]; funds[k] = (funds[k] || 0) + v; } });
  const fundRows = Object.entries(funds).sort((a, b) => b[1] - a[1]).slice(0, 12);
  view(`
  <div class="card"><h2>분야별 규모·증감 <span class="sub">(${PREV} 확정 → ${CUR} 정부안)</span></h2>
    <table><tr><th>분야</th><th>${CUR}</th><th>증감</th></tr>
    ${rows.map(([k, a, b]) => `<tr><td>${esc(k)}<div class="bar" style="margin-top:4px"><i style="width:${(a / max * 100).toFixed(0)}%"></i></div></td>
      <td>${jo(a)}</td><td class="${a > b ? "warn" : "ok"}">${pct((a / b - 1) * 100)}</td></tr>`).join("")}
    </table></div>
  <div class="card"><h2>회계·기금 구성 <span class="sub">(${CUR} 정부안 상위 12)</span></h2>
    <table>${fundRows.map(([k, v]) => `<tr><td>${esc(k)}</td><td>${jo(v)}</td></tr>`).join("")}</table></div>
  <div class="card"><h2>연도별 총지출 <span class="sub">(국회 확정, ${CUR}은 정부안)</span></h2>
    <table><tr><th>연도</th><th>정부안</th><th>국회 확정</th><th>증감(확정 기준)</th></tr>
    ${YEARS.map((y, i) => { const gv = total(y, "gov"), nv = total(y, "na"), prev = i ? total(YEARS[i - 1], "na") : null;
      return `<tr><td>${y}</td><td>${jo(gv)}</td><td>${nv ? jo(nv) : "-"}</td><td>${prev ? pct(((nv || gv) / prev - 1) * 100) : "-"}</td></tr>`; }).join("")}
    </table></div>
  ${execSummary()}`);
};
function execSummary() {
  if (!U.length) return `<div class="card"><h2>결산 요약</h2><div class="sub">결산(집행·이월·불용) 데이터는 아직 연결 전입니다.</div></div>`;
  const ey = D.exec_years;
  const sum = (y, k) => U.reduce((a, u) => a + ((u.years[y] || {})[k] || 0), 0);
  const top = U.filter(u => u.years[EXEC_LAST]).sort((a, b) => b.years[EXEC_LAST].unused - a.years[EXEC_LAST].unused).slice(0, 10);
  return `<div class="card"><h2>결산 요약 <span class="sub">(세출·지출, 여유자금 운용 제외)</span></h2>
    <table><tr><th>연도</th><th>예산현액</th><th>지출</th><th>이월</th><th>불용</th><th>집행률</th></tr>
    ${ey.map(y => { const c = sum(y, "cur"), s = sum(y, "spent"); return `<tr><td>${y}</td><td>${jo(c)}</td><td>${jo(s)}</td><td>${jo(sum(y, "carry"))}</td><td class="warn">${jo(sum(y, "unused"))}</td><td>${(s / c * 100).toFixed(1)}%</td></tr>`; }).join("")}
    </table></div>
  <div class="card"><h2>${EXEC_LAST} 불용액 큰 단위사업 <span class="sub">(억원)</span></h2>
    ${top.map(u => { const v = u.years[EXEC_LAST]; return `<div class="item"><b>${esc(u.activity)}</b> <span class="sub">${esc(u.ministry)} · ${esc(u.program)}</span><br>
      <span class="sub">현액 ${won(v.cur)} · 지출 ${won(v.spent)} · 이월 ${won(v.carry)} · <span class="warn">불용 ${won(v.unused)}</span> · 집행률 ${v.rate.toFixed(1)}%</span></div>`; }).join("")}</div>`;
}

/* ---------- 3. 예산 탐색 ---------- */
VIEWS.explore = () => {
  view(`
  <div class="card"><h2>사업 찾기</h2>
    <input id="eq" placeholder="사업명·부처·프로그램" oninput="document.getElementById('er').innerHTML = search(this.value, 20).map(resultRow).join('')">
    <div id="er" style="margin-top:6px"></div></div>
  <div id="detail"></div>`);
};
function openProject(id) {
  if (cur !== "explore") { cur = "explore"; drawTabs(); VIEWS.explore(); }
  const p = P.find(x => x.id === id);
  if (!p) return;
  const vals = YEARS.map(y => y === CUR ? Y(p, y).gov : amt(p, y));
  const mx = Math.max(1, ...vals.map(v => v || 0));
  const bars = YEARS.map((y, i) => {
    const v = vals[i] || 0, h = v / mx * 120;
    return `<g transform="translate(${i * 80 + 30},${150 - h})">
      <rect width="50" height="${h}" fill="var(--accent)" opacity="${y === CUR ? 1 : .55}"></rect>
      <text x="25" y="-4" text-anchor="middle">${vals[i] == null ? "-" : won(vals[i])}</text>
      <text x="25" y="${h + 14}" text-anchor="middle">${y}${y === CUR ? "안" : ""}</text></g>`;
  }).join("");
  const ex = (D.exec_years || [CUR - 4, CUR - 3, CUR - 2]).map(y => [y, E(p, y)]).filter(([, e]) => e);
  const u = unitOf(p);
  document.getElementById("detail").innerHTML = `
  <div class="card"><h2>${esc(p.name)}</h2>
    <div class="sub">${esc(p.ministry)} · ${esc(p.fund || "")} · ${esc(p.field)}${p.sector ? " > " + esc(p.sector) : ""}<br>
      ${esc(p.program || "")}${p.activity ? " > " + esc(p.activity) : ""} · 단위 ${esc(D.unit)}</div>
    ${p.prev_ministry ? `<div class="tag">소관 변경: ${esc(p.prev_ministry.join(", "))} → ${esc(p.ministry)}</div>` : ""}
    ${p.pooled_from ? `<div class="tag">${CUR} ${esc(p.ministry)} 일괄계상 (원 부처: ${esc(p.pooled_from)})</div>` : ""}
    ${p.aka ? `<div class="tag">이전 사업명: ${esc(p.aka.join(", "))}</div>` : ""}
    <svg viewBox="0 0 340 170" width="100%" style="max-width:420px;margin-top:8px">${bars}</svg>
    <table><tr><th>연도</th><th>정부안</th><th>국회 확정</th><th>국회 증감</th></tr>
      ${YEARS.map(y => { const v = Y(p, y); return `<tr><td>${y}</td><td>${won(v.gov)}</td><td>${won(v.na)}</td>
        <td class="sub">${v.gov != null && v.na != null ? won(v.na - v.gov) : "-"}</td></tr>`; }).join("")}
    </table>
    <div class="sub" style="margin-top:6px">${CUR} 정부안 vs ${PREV} 확정: ${isNew(p) ? '<b class="warn">신규</b>' : isGone(p) ? '<b class="ok">미편성</b>' : `${won(diff(p))}억 (${pct(chg(p) * 100)})`}</div></div>
  <div class="card"><h2>집행 이력 <span class="sub">(결산)</span></h2>
    ${u ? `<div class="sub" style="margin-bottom:6px">단위사업 <b>${esc(u.activity)}</b> 전체 기준 (${esc(u.ministry)} · ${esc(u.funds.join(", "))})</div>` : ""}
    ${ex.length ? `<table><tr><th>연도</th><th>예산현액</th><th>지출</th><th>이월</th><th>불용</th><th>집행률</th></tr>
      ${ex.map(([y, e]) => `<tr><td>${y}</td><td>${won(e.budget)}</td><td>${won(e.spent)}</td><td>${won(e.carry)}</td><td>${won(e.unused)}</td>
        <td class="${e.rate != null && e.rate < 80 ? "warn" : ""}">${e.rate == null ? "-" : e.rate.toFixed(1) + "%"}</td></tr>`).join("")}</table>`
      : `<div class="sub">${HAS_EXEC ? "연결된 결산 자료가 없습니다 (신규 사업이거나 단위사업명이 바뀐 경우)." : "결산 데이터 연결 전"}</div>`}</div>
  <div class="card"><h2>국회 검토 문서</h2>
    ${(p.docs || []).length ? p.docs.map(d => `<div class="doc"><b>${esc(d.title)}</b> · ${d.page}쪽<br>${esc(d.text)}</div>`).join("") : '<div class="sub">검토보고서 연결 전</div>'}</div>`;
  document.getElementById("detail").scrollIntoView({ behavior: "smooth" });
}

/* ---------- 4. 심사 참고 ---------- */
const RULES = [
  { label: `${CUR} 신규 사업 (100억 이상)`, test: p => isNew(p) && curGov(p) >= 100 },
  { label: "전년 대비 50% 이상 증가 (100억 이상)", test: p => chg(p) >= 0.5 && curGov(p) >= 100 },
  { label: "전년 대비 1,000억 이상 증가", test: p => diff(p) >= 1000 },
  { label: "전년 대비 30% 이상 감소 (100억 이상)", test: p => chg(p) <= -0.3 && base(p) >= 100 },
  { label: "전년 대비 1,000억 이상 감소", test: p => diff(p) <= -1000 },
  { label: `${PREV} 국회에서 10% 이상 증액된 사업`, test: p => { const v = Y(p, PREV); return v.gov > 0 && v.na >= v.gov * 1.1 && v.na - v.gov >= 10; } },
  { label: `${EXEC_LAST} 단위사업 집행률 80% 미만 (현액 100억 이상)`, test: p => { const e = E(p, EXEC_LAST); return e && e.rate != null && e.rate < 80 && e.budget >= 100; } },
  { label: `${EXEC_LAST - 1}·${EXEC_LAST} 2년 연속 이월+불용 20% 이상`, test: p => [EXEC_LAST - 1, EXEC_LAST].every(y => { const e = E(p, y); return e && e.budget >= 100 && idle(e) >= 20; }) },
  { label: `${EXEC_LAST} 집행률 90% 미만인데 ${CUR} 증액`, test: p => { const e = E(p, EXEC_LAST); return e && e.rate != null && e.rate < 90 && e.budget >= 100 && diff(p) > 0 && chg(p) > 0.05; } },
];
VIEWS.review = () => {
  const hits = P.map(p => ({ p, hit: RULES.filter(r => r.test(p)) })).filter(x => x.hit.length)
    .sort((a, b) => b.hit.length - a.hit.length || Math.abs(diff(b.p)) - Math.abs(diff(a.p)));
  const counts = RULES.map(r => [r.label, hits.filter(h => h.hit.includes(r)).length]);
  view(`
  <div class="card"><h2>심사 참고: 규칙 기반 검토 대상</h2>
    <div class="sub">규칙은 참고용 예시 기준입니다. 최종 판단은 심사자가 합니다.</div>
    <div style="margin-top:8px">${counts.map(([l, c]) => `<span class="tag">${l} · ${c}</span>`).join("")}</div></div>
  <div class="card"><h2>검토 대상 ${hits.length.toLocaleString()}건 <span class="sub">(해당 규칙 수 → 증감 규모순, 상위 150)</span></h2>
    ${hits.slice(0, 150).map(({ p, hit }) => `<div class="item">${link(p)}<br>
      <span class="sub">${won(base(p))} → ${won(curGov(p))}억 (${isNew(p) ? "신규" : pct(chg(p) * 100)})</span><br>
      ${hit.map(h => `<span class="tag warn">${h.label}</span>`).join("")}</div>`).join("") || "<div class='sub'>해당 없음</div>"}</div>`);
};

/* ---------- 5. 조건으로 찾기 ---------- */
VIEWS.filter = () => {
  view(`
  <div class="card"><h2>조건을 문장으로 입력</h2>
    <div class="row"><input id="cond" placeholder="예: 교육부 집행률 80% 미만 증가율 10% 이상" onkeydown="if(event.key==='Enter')runFilter()"><button class="go" onclick="runFilter()">찾기</button></div>
    <div class="sub" style="margin-top:8px">인식하는 조건: 분야명·부처명, "증가율 N% 이상/이하", "집행률 N% 미만/이상"(최근 결산), "감소율 N% 이상", "N억 이상/이하"(${CUR} 정부안), "신규", "미편성", 그 밖의 단어는 사업명 검색</div>
    <div id="fres" style="margin-top:12px"></div></div>`);
};
function runFilter() {
  let s = document.getElementById("cond").value;
  const conds = [], desc = [];
  const num = re => { const m = s.match(re); if (m) s = s.replace(m[0], " "); return m ? +m[1].replace(/,/g, "") : null; };
  const up = num(/증가율\s*(\d+)\s*%\s*이상/), upMax = num(/증가율\s*(\d+)\s*%\s*이하/), cut = num(/감소율\s*(\d+)\s*%\s*이상/);
  const amin = num(/([\d,]+)\s*억\s*(?:원)?\s*이상/), amax = num(/([\d,]+)\s*억\s*(?:원)?\s*이하/);
  const exLow = num(/집행률\s*(\d+)\s*%\s*(?:미만|이하)/), exHigh = num(/집행률\s*(\d+)\s*%\s*이상/);
  if (exLow != null) { conds.push(p => { const e = E(p, EXEC_LAST); return e && e.rate != null && e.rate < exLow; }); desc.push(`${EXEC_LAST} 집행률 < ${exLow}%`); }
  if (exHigh != null) { conds.push(p => { const e = E(p, EXEC_LAST); return e && e.rate != null && e.rate >= exHigh; }); desc.push(`${EXEC_LAST} 집행률 ≥ ${exHigh}%`); }
  if (up != null) { conds.push(p => chg(p) * 100 >= up); desc.push(`증가율 ≥ ${up}%`); }
  if (upMax != null) { conds.push(p => chg(p) * 100 <= upMax); desc.push(`증가율 ≤ ${upMax}%`); }
  if (cut != null) { conds.push(p => chg(p) * -100 >= cut); desc.push(`감소율 ≥ ${cut}%`); }
  if (amin != null) { conds.push(p => (curGov(p) || 0) >= amin); desc.push(`${CUR} 정부안 ≥ ${amin}억`); }
  if (amax != null) { conds.push(p => (curGov(p) || 0) <= amax); desc.push(`${CUR} 정부안 ≤ ${amax}억`); }
  if (/신규/.test(s)) { conds.push(isNew); desc.push("신규"); s = s.replace(/신규(\s*사업)?/, " "); }
  if (/미편성|폐지/.test(s)) { conds.push(isGone); desc.push("미편성"); s = s.replace(/미편성|폐지/, " "); }
  const fields = [...new Set(P.map(p => p.field))], mins = [...new Set(P.map(p => p.ministry))];
  const m = mins.sort((a, b) => b.length - a.length).find(x => s.includes(x)); if (m) { conds.push(p => p.ministry === m); desc.push(`소관=${m}`); s = s.replace(m, " "); }
  const f = fields.sort((a, b) => b.length - a.length).find(x => s.includes(x)); if (f) { conds.push(p => p.field === f); desc.push(`분야=${f}`); s = s.replace(f, " "); }
  const words = s.replace(/분야|사업|중에?|이고|그리고|인|및/g, " ").split(/\s+/).filter(w => w.length >= 2);
  words.forEach(w => { conds.push(p => `${p.name} ${p.program || ""} ${p.activity || ""}`.includes(w)); desc.push(`"${w}" 포함`); });
  const res = conds.length ? P.filter(p => conds.every(c => c(p))).sort((a, b) => Math.abs(diff(b)) - Math.abs(diff(a))) : [];
  document.getElementById("fres").innerHTML = conds.length
    ? `<div class="sub">해석: ${desc.map(esc).join(" · ")} → ${res.length.toLocaleString()}건 (증감 규모순 상위 50)</div>` + res.slice(0, 50).map(resultRow).join("")
    : "<div class='sub'>조건을 인식하지 못했습니다.</div>";
}

/* ---------- 6. AI에게 묻기 ---------- */
VIEWS.ask = () => {
  view(`
  <div class="card"><h2>국회 검토 문서 기반 질문</h2>
    ${HAS_DOCS ? "" : '<div class="doc">국회 검토보고서·사업설명자료가 아직 연결되지 않아, 지금은 <b>예산·결산 수치</b>만 근거로 찾아 드립니다.</div>'}
    <div class="row"><input id="aq" placeholder="예: 늘봄학교 예산은 얼마나 늘었나?" onkeydown="if(event.key==='Enter')ask()"><button class="go" onclick="ask()">질문</button></div>
    <details style="margin-top:10px"><summary class="sub">AI 답변 사용 (선택: Upstage API 키 입력 시 요약 생성)</summary>
      <input id="akey" type="password" placeholder="키는 저장되지 않습니다" style="margin-top:8px">
      <input id="amodel" value="solar-pro2" style="margin-top:6px"></details>
    <div id="ans" style="margin-top:12px"></div></div>`);
};
const STOP = /(은|는|이|가|을|를|의|에|와|과|도|로|으로|얼마나|얼마|어떻게|무엇|있나요|늘었나|줄었나|예산|사업|\?)$/;
function retrieve(q) {
  const terms = q.split(/[\s,?.!]+/).map(t => t.replace(STOP, "")).filter(t => t.length >= 2);
  return P.map(p => {
    const hay = `${p.name} ${p.program || ""} ${p.activity || ""} ${p.ministry} ${(p.docs || []).map(d => d.text).join(" ")}`;
    return { p, score: terms.reduce((a, t) => a + (hay.includes(t) ? (p.name.includes(t) ? 2 : 1) : 0), 0) };
  }).filter(x => x.score > 0).sort((a, b) => b.score - a.score || (curGov(b.p) || 0) - (curGov(a.p) || 0)).slice(0, 5);
}
const fact = p => `${p.ministry} ${p.program || ""} > ${p.name}: ` + YEARS.map(y => { const v = Y(p, y); return `${y} 정부안 ${won(v.gov)}억, 확정 ${won(v.na)}억`; }).join("; ")
  + ((D.exec_years || []).some(y => E(p, y)) ? ` / 소속 단위사업 '${unitOf(p) ? unitOf(p).activity : ""}' 결산: ` + D.exec_years.map(y => { const e = E(p, y); return e ? `${y} 집행률 ${e.rate.toFixed(1)}%, 불용 ${won(e.unused)}억` : ""; }).filter(Boolean).join("; ") : "");
async function ask() {
  const q = document.getElementById("aq").value.trim(); if (!q) return;
  const hits = retrieve(q), box = document.getElementById("ans");
  if (!hits.length) { box.innerHTML = "<div class='sub'>관련 사업을 찾지 못했습니다.</div>"; return; }
  const cite = hits.map(({ p }) => `<div class="doc">${link(p)}<br><span class="sub">출처: 열린재정 총지출 세부사업 · ${YEARS.map(y => `${y} ${won(amt(p, y))}`).join(" → ")}억</span></div>`).join("");
  const key = document.getElementById("akey").value.trim();
  if (!key) { box.innerHTML = `<div class="sub">관련 사업 (AI 요약 미사용)</div>${cite}`; return; }
  box.innerHTML = `<div class="sub">요약 생성 중…</div>`;
  try {
    const r = await fetch("https://api.upstage.ai/v1/chat/completions", {
      method: "POST", headers: { "Authorization": "Bearer " + key, "Content-Type": "application/json" },
      body: JSON.stringify({ model: document.getElementById("amodel").value, messages: [
        { role: "system", content: "제공된 자료만 근거로 한국어로 답하세요. 근거가 없으면 없다고 말하세요. 금액 단위는 억원입니다. 인용한 사업명을 밝히세요." },
        { role: "user", content: "질문: " + q + "\n\n자료:\n" + hits.map(h => fact(h.p)).join("\n") }] })
    });
    const j = await r.json();
    box.innerHTML = `<div class="doc">${esc(j.choices ? j.choices[0].message.content : JSON.stringify(j))}</div><div class="sub">근거</div>${cite}`;
  } catch (e) { box.innerHTML = `<div class="warn">요약 호출 실패: ${esc(e.message)}</div>${cite}`; }
}

/* ---------- 7. 삶의 질 지표 ---------- */
VIEWS.quality = () => {
  view(`<div class="card"><h2>229개 시군구 삶의 질 지표</h2>
    <div class="sub">시군구 지표는 별도 프로젝트 <a href="https://lloydknam.github.io/life-stats/">클사무관의 라이프 인덱스</a>에서 볼 수 있습니다.</div></div>`);
};

drawTabs();
VIEWS.home();
</script>
