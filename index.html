<script>
const D = window.BUDGET;
// 압축된 실데이터를 원래 구조로 풀기 (scripts/build.py 참고)
if (D.packed) {
  const { keys, years, dicts, rows } = D.packed;
  D.projects = rows.map((r, i) => {
    const p = { id: "B" + String(i + 1).padStart(5, "0"), exec: {}, docs: [], years: {} };
    keys.forEach((k, j) => p[k] = dicts[k][r[j]]);
    p.name = r[keys.length];
    years.forEach((y, j) => {
      const g = r[keys.length + 1 + j * 2], n = r[keys.length + 2 + j * 2];
      if (g != null || n != null) p.years[y] = { gov: g, na: n };
    });
    const extra = r[keys.length + 1 + years.length * 2];
    if (extra) Object.assign(p, extra);
    return p;
  });
  if (D.packed.units) {
    const ey = D.exec_years || [];
    D.units = D.packed.units.map(r => {
      const u = { ministry: dicts.ministry[r[0]], activity: r[1], program: r[2], funds: r[3] ? r[3].split(",") : [], years: {} };
      ey.forEach((y, j) => { const v = r[4 + j]; if (v) u.years[y] = { cur: v[0], spent: v[1], carry: v[2], unused: v[3], rate: v[0] > 0 ? v[1] / v[0] * 100 : null }; });
      return u;
    });
  }
  delete D.packed;
}
const U = D.units || [];
const P = D.projects;
const YEARS = [2024, 2025, 2026, 2027];
const CUR = 2027, PREV = 2026;
const SAMPLE = !D.source;

/* ---------- 공통 ---------- */
const won = n => n == null || isNaN(n) ? "-" : Number(n).toLocaleString("ko-KR", { maximumFractionDigits: 1 });
const jo = n => n == null || isNaN(n) ? "-" : (n / 10000).toLocaleString("ko-KR", { maximumFractionDigits: 1 }) + "조";
const pct = n => (n == null || !isFinite(n)) ? "-" : (n > 0 ? "+" : "") + n.toFixed(1) + "%";
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const Y = (p, y) => (p.years && p.years[y]) || { gov: null, na: null };
// 결산: 세부사업이 속한 단위사업 전체 실적 (열린재정 결산은 단위사업 단위)
const unitOf = p => (p.unit != null && U[p.unit]) || null;
const E = (p, y) => { const u = unitOf(p); const v = u && u.years[y]; return v ? { budget: v.cur, spent: v.spent, carry: v.carry, unused: v.unused, rate: v.rate } : (p.exec && p.exec[y]) || null; };
const EXEC_LAST = (D.exec_years || []).slice(-1)[0] || CUR - 2;
const idle = e => e && e.budget > 0 ? (e.carry + e.unused) / e.budget * 100 : null;  // 이월+불용 비율
// 금융·내부거래성 단위사업 (원리금 상환, 예탁·예수, 회계·기금 간 전출입): 집행 부진 판단에서 제외
const FIN_RE = /(원금상환|이자상환|원리금|예탁|예수|전출|전입|회계간|기금간|내부거래|차입금|국공채|국채)/;
const isFin = u => !!u && FIN_RE.test(u.activity);
const isFundUnit = u => u.funds.length > 0 && u.funds.every(f => /기금/.test(f));
const Eb = (p, y) => isFin(unitOf(p)) ? null : E(p, y);   // 심사 규칙용 (금융·내부거래 제외)
// 연도별 대표값: 국회 확정이 있으면 확정, 없으면 정부안
const amt = (p, y) => { const v = Y(p, y); return v.na != null ? v.na : v.gov; };
const base = p => Y(p, PREV).na;           // 비교 기준: 전년도 국회 확정
const curGov = p => Y(p, CUR).gov;         // 올해 정부안
const diff = p => (curGov(p) || 0) - (base(p) || 0);
const chg = p => (base(p) > 0 && curGov(p) != null) ? curGov(p) / base(p) - 1 : NaN;
const linked = p => !!(p.aka || p.prev_ministry || p.pooled_from);   // 명칭·소관 변경, 일괄계상으로 전년과 이어지는 사업
const isNew = p => !(base(p) > 0) && curGov(p) > 0 && !linked(p);
const isGone = p => base(p) > 0 && !(curGov(p) > 0);
const HAS_EXEC = U.length > 0 || P.some(p => p.exec && Object.keys(p.exec).length);
const HAS_DOCS = P.some(p => p.docs && p.docs.length);
const label = p => `${esc(p.name)} <span class="sub">${esc(p.ministry)}${p.program ? " · " + esc(p.program) : ""}</span>`;
const link = p => `<a href="#" onclick="openProject('${p.id}');return false">${label(p)}</a>`;

/* 설명 본문 전체 낱말 색인: 초성별 샤드 (desc/terms/<초성>.json.gz, scripts/shard_terms.py). 검색어에 필요한 샤드만 받는다 */
let PID_MAP = null;
const TERM_SH = {};
const choseong = t => { const c = t.charCodeAt(0) - 0xAC00; return c >= 0 && c < 11172 ? String(Math.floor(c / 588)) : "x"; };
async function termShard(k) {
  if (!(k in TERM_SH)) { const v = await gunzipJSON(`desc/terms/${k}.json.gz`).catch(() => null); if (v) TERM_SH[k] = v; else return {}; }
  return TERM_SH[k];
}
const projById = id => { if (!PID_MAP) PID_MAP = new Map(P.map(p => [p.id, p])); return PID_MAP.get(id); };
async function termHits(q) {
  const toks = (q.match(/[가-힣A-Za-z0-9]{2,}/g) || []);
  if (!toks.length) return [];
  let ids = null;
  for (const t of toks) {
    const T = await termShard(choseong(t));
    const list = T[t] || [];
    ids = ids === null ? list.slice() : ids.filter(x => list.includes(x));
    if (!ids.length) break;
  }
  return (ids || []).map(projById).filter(Boolean).sort((a, b) => (curGov(b) || 0) - (curGov(a) || 0));
}
async function descSearch(q, target) {

  target.innerHTML = hits.length
    ? `<div class="sub">설명 본문에서 찾은 사업 ${hits.length}건 (금액 큰 순, 상위 30)</div>` + hits.map(resultRow).join("")

}

  .replace(/\s*\/\s*(?=-\s)/g, "\n")                                              // "/ - 항목"
  .replace(/\s*\/\s*(?=[○●◎■□※▶①-⑩*]|제\d|\d+[.)]\s|\(\d)/g, "\n")              // "/ ○", "/ 제30조", "/ ②", "/ 2010. 12." (수식의 "/"는 그대로)
  .replace(/\s*([○●◎■□※▶])\s*/g, "\n$1 ")

const descBlock = b => {
  if (typeof b === "string") {
    const t = b.trim();
    if (/^\d+\.\s*\S/.test(t)) return `<h3>${esc(b)}</h3>`;                         // 1. 사업 총괄 정보
    if (/^\(\d+(-\d+)?\)/.test(t)) return `<h5>${esc(b)}</h5>`;             // (1-1) 소목차 (흰색)
    return /^(\d+\)|[①-⑩])/.test(t) ? `<h4>${esc(b)}</h4>` : linesHTML(b);      // 1) 중목차 (녹색)

  if (b && b.tbl) {

const niceStep = span => { if (!(span > 0)) return 1; const p = 10 ** Math.floor(Math.log10(span / 4)), f = span / 4 / p; return (f <= 1 ? 1 : f <= 2 ? 2 : f <= 5 ? 5 : 10) * p; };

  const xl = (opt.labels || []).map((t, i) => t ? `<text x="${X(i)}" y="${H - 8}" text-anchor="middle" font-size="11" fill="var(--sub)">${t}</text>` : "").join("");

function seriesChartHTML(d) {
  const ys = d.years, S = d.series;
  const all = S.flatMap(s => ys.map(y => s.values[y]).filter(v => v != null && isFinite(v)));
  if (!all.length) return `<p class="sub">표시할 값이 없습니다.</p>`;
  const lo = Math.min(0, ...all), hi = Math.max(...all), span = (hi - lo) || 1;
  const W = 640, H = 260, L = 56, R = 16, T = 14, B = 30;
  const x = i => L + (ys.length === 1 ? (W - L - R) / 2 : i * (W - L - R) / (ys.length - 1));
  const y = v => T + (H - T - B) * (1 - (v - lo) / span);
  const grid = [0, 0.25, 0.5, 0.75, 1].map(t => { const v = lo + span * t; return `<line x1="${L}" x2="${W - R}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)"/><text x="${L - 6}" y="${y(v) + 4}" text-anchor="end" font-size="18" fill="var(--sub)">${esc(String(Math.round(v)))}</text>`; }).join("");
  const xl = ys.map((yr, i) => `<text x="${x(i)}" y="${H - 8}" text-anchor="middle" font-size="18" fill="var(--sub)">${yr}</text>`).join("");
  const lines = S.map((s, k) => {
    const c = SERIES_COLORS[k % SERIES_COLORS.length];
    const pts = ys.map((yr, i) => s.values[yr] != null ? [x(i), y(s.values[yr])] : null).filter(Boolean);
    return `<polyline fill="none" stroke="${c}" stroke-width="2" points="${pts.map(p => p.join(",")).join(" ")}"/>` +
      pts.map(p => `<circle cx="${p[0]}" cy="${p[1]}" r="3" fill="${c}"/>`).join("");
  }).join("");
  const legend = S.length > 1 ? `<div class="sub" style="margin-top:6px">${S.map((s, k) => `<span style="color:${SERIES_COLORS[k % SERIES_COLORS.length]}">■</span> ${esc(s.name)}`).join("&nbsp;&nbsp;")}</div>` : "";
  const table = `<table><tr><th>구분</th>${ys.map(yr => `<th>${yr}</th>`).join("")}</tr>${S.map(s =>
    `<tr><td>${esc(s.name)}</td>${ys.map(yr => `<td>${s.values[yr] != null ? esc(won(s.values[yr])) : "-"}</td>`).join("")}</tr>`).join("")}</table>`;
  const src = d.source ? `<div class="sub" style="margin-top:8px">출처: ${esc(d.source)} · 단위 ${esc(d.unit || "")}</div>` : "";
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(d.title)} 차트">${grid}${xl}${lines}</svg>${legend}${table}${src}`;
}

       <span>${d.online ? `<a class="bsbtn" href="${esc(d.online)}" target="_blank" rel="noopener">온라인 신청</a>` : ""}</span></div>`;
  el.classList.add("on"); document.body.style.overflow = "hidden";

async function bnClose(now) {

  if (card) { card.classList.remove("open"); card.focus({ preventScroll: true }); }
  bnFrom = null;

const STOP = /(은|는|이|가|을|를|의|에|와|과|도|로|으로|얼마나|얼마|어떻게|무엇|있나요|늘었나|줄었나|예산|사업|\?)$/;
function retrieve(q) {
  const terms = q.split(/[\s,?.!]+/).map(t => t.replace(STOP, "")).filter(t => t.length >= 2);
  return P.map(p => {
    const hay = `${p.name} ${p.program || ""} ${p.activity || ""} ${p.ministry} ${(p.docs || []).map(d => d.text).join(" ")} ${itemsOf(p).map(i => i.name).join(" ")}`;
    return { p, score: terms.reduce((a, t) => a + (hay.includes(t) ? (p.name.includes(t) ? 2 : 1) : 0), 0) };
  }).filter(x => x.score > 0).sort((a, b) => b.score - a.score || (curGov(b.p) || 0) - (curGov(a.p) || 0)).slice(0, 5);
}
const fact = p => `${p.ministry} ${p.program || ""} > ${p.name}: ` + YEARS.map(y => { const v = Y(p, y); return `${y} 정부안 ${won(v.gov)}억, 확정 ${won(v.na)}억`; }).join("; ")
  + ((D.exec_years || []).some(y => E(p, y)) ? ` / 소속 단위사업 '${unitOf(p) ? unitOf(p).activity : ""}' 결산: ` + D.exec_years.map(y => { const e = E(p, y); return e ? `${y} 집행률 ${e.rate == null ? "-" : e.rate.toFixed(1) + "%"}, 불용 ${won(e.unused)}억` : ""; }).filter(Boolean).join("; ") : "");
/* AI분석: 재정통계(재정통계 탭 카드 + 열린재정 통계 그래프 자료)에서도 관련 통계를 찾는다 */
const STAT_KW = { supp: ["추경", "추가경정"], execm: ["집행", "집행률", "집행진도"], debt: ["국가채무", "채무", "나랏빚", "부채", "의무지출", "재량지출"], plan: ["중기", "재정계획", "재정운용계획", "재정수지", "관리재정수지"] };
const STAT_GENERIC = new Set(["예산", "사업", "재정", "정부", "국가", "얼마", "증가", "감소", "추이", "규모", "현황", "지원", "작년", "올해", "내년", "비교"]);
const qTerms = q => q.split(/[\s,?.!]+/).map(t => t.replace(STOP, "")).filter(t => t.length >= 2);
let CAT_IDX = null, STAT_HITS = [];
async function statHits(q) {
  const terms = qTerms(q).filter(t => !STAT_GENERIC.has(t)); if (!terms.length) return [];
  try { if (!OA_DATA) OA_DATA = await fetch("data/openfiscal_api.json").then(r => r.json()); } catch (e) {}
  try { if (!CAT_IDX) CAT_IDX = await fetch("data/fiscal/catalog/index.json").then(r => r.json()); } catch (e) { CAT_IDX = { items: {} }; }
  const out = [];
  FISC_CARDS.forEach(c => {
    const kw = STAT_KW[c.id] || [];
    const s = terms.reduce((a, t) => a + (kw.some(k => t.includes(k) || k.includes(t)) ? 3 : 0) + (c.title.includes(t) ? 2 : 0), 0);
    if (s > 0) out.push({ kind: "card", id: c.id, name: c.title, score: s + 1 });
  });
  (OA_DATA ? OA_DATA.groups : []).forEach((g, gi) => g.items.forEach((it, ii) => {
    if (!CAT_IDX.items[it.no]) return;   // 그래프 자료가 있는 통계만
    const nm = it.name.replace(/\s/g, "");
    const s = terms.reduce((a, t) => a + (nm.includes(t) ? t.length : 0), 0);
    if (s >= 2) out.push({ kind: "oa", gi, ii, no: it.no, name: it.name, score: s });
  }));
  return out.sort((a, b) => b.score - a.score).slice(0, 4);
}
async function statFacts(h) {
  if (h.kind === "card") {
    await loadFiscal();
    const c = FISC_CARDS.find(x => x.id === h.id), box = document.createElement("div");
    box.innerHTML = c.body().replace(/<svg[\s\S]*?<\/svg>/g, " ").replace(/<\/t[dh]>/g, " | $&").replace(/<\/(tr|h4|div)>/g, "$&\n");
    return { title: c.title + " " + c.sub, source: "열린재정 (재정통계 탭)", facts: box.textContent.replace(/[ \t]+/g, " ").replace(/\n\s*/g, " / ").slice(0, 1500), text: "" };
  }
  let d = null; try { d = await fetch(`data/fiscal/catalog/${h.no}.json`).then(r => r.ok ? r.json() : null); } catch (e) {}
  if (!d) return null;
  const lines = [], named = (d.nums || []).filter(n => /[가-힣]/.test(d.cols[n] || ""));
  if (!named.length) return null;   // 열 이름이 코드뿐이면 단위·뜻을 알 수 없어 AI 근거에서 뺀다
  named.slice(0, 3).forEach(n => {
    const u = colUnit(d.cols[n]), f = v => v == null ? "-" : fmtU(v * u.f, u);
    if (d.trend && d.trend.series[n]) {
      const xs = d.trend.x, k0 = Math.max(0, xs.length - 5);
      Object.entries(d.trend.series[n]).slice(0, 6).forEach(([lab, vals]) => lines.push(`${d.cols[n]} · ${lab}: ` + xs.slice(k0).map((x, i) => `${x} ${f(vals[k0 + i])}`).join(", ")));
    }
    if (d.parts) { const i = d.nums.indexOf(n) + 1; lines.push(`${d.cols[n]} ${d.last || ""} ${d.cols[d.parts.by] || ""}별: ` + d.parts.rows.slice(0, 8).map(r => `${r[0]} ${f(r[i])}`).join(", ")); }
  });
  return { title: d.name, source: `열린재정 재정상세통계${d.org ? " · " + d.org : ""}`, facts: lines.join(" / ").slice(0, 1500), text: "" };
}

/* 진행 표시: 점멸하는 점 + 경과 시간(초) */
let THINK_T = null;
function thinking(box, label) {
  clearInterval(THINK_T);
  const t0 = performance.now();
  box.innerHTML = `<div class="card thinking" role="status" aria-live="polite"><span class="think-dot"></span><span class="think-lab">${label}</span><span class="think-dots" aria-hidden="true"><i>.</i><i>.</i><i>.</i></span><span class="think-sec">0.0초</span></div>`;
  const sec = box.querySelector(".think-sec");
  THINK_T = setInterval(() => { if (!sec.isConnected) return clearInterval(THINK_T); sec.textContent = ((performance.now() - t0) / 1000).toFixed(1) + "초"; }, 100);
  return () => { clearInterval(THINK_T); return (performance.now() - t0) / 1000; };
}
async function ask() {
  const q = (document.getElementById("aq").value || "").trim(); if (!q) return;
  const box = document.getElementById("ans");
  thinking(box, "자료를 찾는 중");
  await naeyeokData();
  const got = retrieve(q);
  const extra = (await termHits(q)).filter(p => !got.some(h => h.p === p)).slice(0, 3).map(p => ({ p, score: 0 }));
  const hits = [...got, ...extra].slice(0, 6);
  const stats = await statHits(q); STAT_HITS = stats;
  if (!hits.length && !stats.length) { box.innerHTML = "<div class='card sub'>관련 사업이나 재정통계를 찾지 못했습니다.</div>"; return; }
  const DI = (await loadDescIdx()) || {};
  const texts = await Promise.all(hits.map(async ({ p }) => {
    const id = DI[p.ministry + "|" + p.name];
    if (!id) return "";
    try { return descRecText(await gunzipJSON(`desc/${id}.json.gz`)).slice(0, 1500); } catch (e) { return ""; }
  }));
  const cite = hits.map(({ p }, i) => `<div class="doc"><b class="pname">${label(p)}</b>${DI[p.ministry + "|" + p.name] ? ` <button class="desc-btn" data-min="${esc(p.ministry)}" data-name="${esc(p.name)}" onclick="openDescBtn(this)">사업 설명 보기 ›</button>` : ""}<br><span class="sub">출처: 열린재정 총지출 세부사업 · ${YEARS.map(y => `${y} ${won(amt(p, y))}`).join(" → ")}억</span></div>`).join("");
  const list = hits.length ? `<div class="card"><div class="sub">관련 사업</div>${cite}</div>` : "";
  const statFx = (await Promise.all(stats.map(statFacts)));
  const statList = stats.length ? `<div class="card"><div class="sub">관련 재정통계</div>${stats.map((h, i) => `<div class="doc"><b>${esc(h.name)}</b><br><span class="sub">출처: ${h.kind === "oa" ? "열린재정 재정상세통계" : "열린재정 (재정통계 탭)"}</span><br><button class="desc-btn" onclick="statOpen(${i},this)">그래프 보기 ›</button></div>`).join("")}</div>` : "";

  // 외부 검색결과: 검색과 함께 조회 (LLM 선택과 무관하게 항상)
  // 외부 검색은 Groq 모델을 골랐을 때만 (Groq 내장 검색). 다른 모델은 외부 검색을 하지 않는다.
  const pickNow = (document.querySelector('input[name="llm"]:checked') || {}).value || "gemini";
  const webP = (AI_API && pickNow === "groq")
    ? fetch(AI_API, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ q, web_only: true, llm: "groq" }) })
      .then(r => (r.ok ? r.json() : { error: `HTTP ${r.status}` }))
      .then(j => ({ web: Array.isArray(j.web) ? j.web : [], text: String(j.text || ""), model: String(j.model || ""), quota: j.quota ? j : null, error: String(j.error || "") }))
      .catch(e => ({ web: [], text: "", model: "", quota: null, error: String(e.message || e) }))
    : Promise.resolve({ web: [], text: "", model: "", quota: null, error: "", unsupported: true });
  let answer = "", note = "", usedModel = "", elapsed = 0;
  if (!AI_API) {
    note = "AI 답변 서버가 아직 연결되지 않아 관련 사업 자료만 보여 드립니다.";
  } else {
    const pick = (document.querySelector('input[name="llm"]:checked') || {}).value || "gemini";
    const name = (LLMS.find(([k]) => k === pick) || LLMS[0])[1];
    const stop = thinking(box, `${esc(name)}로 답을 만드는 중`);
    try {
      const sources = [...hits.map(({ p }, i) => ({ kind: "사업", title: `${p.ministry} · ${p.name}`, source: "열린재정 총지출 세부사업", facts: fact(p), text: (texts[i] || "").slice(0, 1500) })),
        ...statFx.filter(Boolean).map(x => ({ kind: "재정통계", ...x }))];
      const r = await fetch(AI_API, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ q, llm: pick, sources }) });
      const j = await r.json();
      if (!r.ok) throw new Error(j.error || `HTTP ${r.status}`);
      answer = String(j.answer || "");
      usedModel = String(j.model || "");
      elapsed = stop();
    } catch (e) {
      stop();
      note = `AI 답변을 받지 못했습니다(${esc(e.message)}). 아래 자료로 직접 확인해 주세요.`;
    }
  }
  const webRes = await webP;
  const webList = webRes.web;
  const quotaLine = webRes.quota
    ? `<div class="doc sub">⚠ ${esc(webRes.quota.model)} · ${esc(webRes.quota.tool)}: 할당량 초과 · ${esc(webRes.quota.checkedAt)} 확인</div>`
    : "";
  const webNote = webRes.unsupported
    ? `<div class="doc sub">외부 검색은 Groq 모델을 선택했을 때만 함께 보여 드립니다.</div>`
    : webRes.text
      ? `<div class="card"><div class="sub">외부 검색 (Groq 웹검색${webRes.model ? ` · ${esc(webRes.model)}` : ""})</div><div class="ansbody">${esc(webRes.text).replace(/\n/g, "<br>")}</div></div>`
      : (webRes.error && !webRes.quota) ? `<div class="doc sub">외부 검색을 가져오지 못했습니다(${esc(webRes.error)})</div>` : "";
  box.innerHTML = (answer ? `<div class="card"><div class="ansbody">${esc(answer).replace(/\n/g, "<br>")}</div><div class="sub" style="margin-top:8px">${usedModel ? `답변 모델: ${esc(usedModel)}${elapsed ? ` (${elapsed.toFixed(1)}초)` : ""} · ` : ""}AI 답변은 아래 자료를 근거로 만들었습니다. 원자료와 함께 확인해 주세요.</div></div>` : "")
    + (note ? `<div class="doc">${note}</div>` : "")
    + list + statList
    + (webList.length ? `<div class="card"><div class="sub">외부 검색결과</div>${webList.map((w, i) => `<div class="doc"><a href="${esc(w.url)}" target="_blank" rel="noopener">[웹${i + 1}] ${esc(w.title)}</a><br><span class="sub">${esc(w.domain || "")}</span></div>`).join("")}</div>` : (quotaLine || webNote));
}
