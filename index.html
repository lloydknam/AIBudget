<body>
<header class="ghead">
  <a class="brand" href="map.html"><img src="assets/clerk.jpg" alt="클사무관" width="56" height="56">
    <h1>클사무관의 <em>예산 프리즘</em></h1></a>
  <div class="hsearch" role="search">
    <input id="gq" type="search" placeholder="사업 검색" autocomplete="off" aria-label="사업 검색" enterkeyhint="search">

    <div id="gres"></div>
  </div>
</header>
<nav id="tabs"></nav>
<main id="view"></main>
<footer>
  <div class="notice" id="notice"></div>
  <a class="lab" href="https://github.com/lloydknam" target="_blank" rel="noopener" title="GitHub(@lloydknam)"><img src="assets/brand/lockup-dark.svg" alt="Lloyd's Balcony Lab · with claude · GitHub(@lloydknam)" height="34"></a>
  <div>*아직 실험 중</div>
</footer>

<script src="data/budget.js"></script>
<script>
const D = window.BUDGET;
// 압축된 실데이터를 원래 구조로 풀기 (scripts/build.py 참고)
if (D.packed) {
  const { keys, years, dicts, rows } = D.packed;
  D.projects = rows.map((r, i) => {
    const p = { id: "B" + String(i + 1).padStart(5, "0"), exec: {}, docs: [], years: {} };
    keys.forEach((k, j) => p[k] = dicts[k][r[j]]);
    p.name = r[keys.length];
    years.forEach((y, j) => {
      const g = r[keys.length + 1 + j * 2], n = r[keys.length + 2 + j * 2];
      if (g != null || n != null) p.years[y] = { gov: g, na: n };
    });
    const extra = r[keys.length + 1 + years.length * 2];
    if (extra) Object.assign(p, extra);
    return p;
  });
  if (D.packed.units) {
    const ey = D.exec_years || [];
    D.units = D.packed.units.map(r => {
      const u = { ministry: dicts.ministry[r[0]], activity: r[1], program: r[2], funds: r[3] ? r[3].split(",") : [], years: {} };
      ey.forEach((y, j) => { const v = r[4 + j]; if (v) u.years[y] = { cur: v[0], spent: v[1], carry: v[2], unused: v[3], rate: v[0] > 0 ? v[1] / v[0] * 100 : null }; });
      return u;
    });
  }
  delete D.packed;
}
const U = D.units || [];
const P = D.projects;
const YEARS = [2024, 2025, 2026, 2027];
const CUR = 2027, PREV = 2026;
const SAMPLE = !D.source;

/* ---------- 공통 ---------- */
const won = n => n == null || isNaN(n) ? "-" : Number(n).toLocaleString("ko-KR", { maximumFractionDigits: 1 });
const jo = n => n == null || isNaN(n) ? "-" : (n / 10000).toLocaleString("ko-KR", { maximumFractionDigits: 1 }) + "조";
const pct = n => (n == null || !isFinite(n)) ? "-" : (n > 0 ? "+" : "") + n.toFixed(1) + "%";
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const Y = (p, y) => (p.years && p.years[y]) || { gov: null, na: null };
// 결산: 세부사업이 속한 단위사업 전체 실적 (열린재정 결산은 단위사업 단위)
const unitOf = p => (p.unit != null && U[p.unit]) || null;
const E = (p, y) => { const u = unitOf(p); const v = u && u.years[y]; return v ? { budget: v.cur, spent: v.spent, carry: v.carry, unused: v.unused, rate: v.rate } : (p.exec && p.exec[y]) || null; };
const EXEC_LAST = (D.exec_years || []).slice(-1)[0] || CUR - 2;
const idle = e => e && e.budget > 0 ? (e.carry + e.unused) / e.budget * 100 : null;  // 이월+불용 비율
// 금융·내부거래성 단위사업 (원리금 상환, 예탁·예수, 회계·기금 간 전출입): 집행 부진 판단에서 제외
const FIN_RE = /(원금상환|이자상환|원리금|예탁|예수|전출|전입|회계간|기금간|내부거래|차입금|국공채|국채)/;
const isFin = u => !!u && FIN_RE.test(u.activity);
const isFundUnit = u => u.funds.length > 0 && u.funds.every(f => /기금/.test(f));
const Eb = (p, y) => isFin(unitOf(p)) ? null : E(p, y);   // 심사 규칙용 (금융·내부거래 제외)
// 연도별 대표값: 국회 확정이 있으면 확정, 없으면 정부안
const amt = (p, y) => { const v = Y(p, y); return v.na != null ? v.na : v.gov; };
const base = p => Y(p, PREV).na;           // 비교 기준: 전년도 국회 확정
const curGov = p => Y(p, CUR).gov;         // 올해 정부안
const diff = p => (curGov(p) || 0) - (base(p) || 0);
const chg = p => (base(p) > 0 && curGov(p) != null) ? curGov(p) / base(p) - 1 : NaN;
const linked = p => !!(p.aka || p.prev_ministry || p.pooled_from);   // 명칭·소관 변경, 일괄계상으로 전년과 이어지는 사업
const isNew = p => !(base(p) > 0) && curGov(p) > 0 && !linked(p);
const isGone = p => base(p) > 0 && !(curGov(p) > 0);
const HAS_EXEC = U.length > 0 || P.some(p => p.exec && Object.keys(p.exec).length);
const HAS_DOCS = P.some(p => p.docs && p.docs.length);
const label = p => `${esc(p.name)} <span class="sub">${esc(p.ministry)}${p.program ? " · " + esc(p.program) : ""}</span>`;
const link = p => `<a href="#" onclick="openProject('${p.id}');return false">${label(p)}</a>`;
const total = (y, k) => D.totals ? D.totals[y][k] : P.reduce((a, p) => a + (Y(p, y)[k] || 0), 0);

document.getElementById("notice").innerHTML = SAMPLE
  ? "화면 시험용 <b>샘플 데이터</b>입니다. 실제 예산 수치가 아닙니다."
  : `출처: 열린재정 Open API · 예산 ${YEARS[0]}~${CUR} (총지출 기준, 세부사업 ${P.length.toLocaleString()}개)${HAS_EXEC ? ` · 결산 ${(D.exec_years || [])[0]}~${EXEC_LAST} (단위사업 ${U.length.toLocaleString()}개)` : ""} · 단위 ${D.unit} · 수집 ${esc((D.fetched_at || "").slice(0, 10))}<br>
     국회 검토문서는 아직 연결 전입니다. 공식 시스템과 무관한 개인 프로젝트입니다.`;

const TABS = [["analysis", "주요분석"], ["benefit", "국민혜택"],
  ["filter", "조건검색"], ["ask", "AI분석"]];
let cur = "analysis";
const ALIAS = { home: "analysis", overview: "analysis", review: "analysis" };   // 예전 주소 호환
function drawTabs() {
const FLASK = '<sup class="flask" role="img" aria-label="실험 중"><svg viewBox="0 0 24 24" width="9" height="10" aria-hidden="true"><path d="M9 2h6M10 2v6L4.6 18.2A2 2 0 0 0 6.3 21h11.4a2 2 0 0 0 1.7-2.8L14 8V2" fill="none" stroke="#facc15" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></svg></sup>';   // 심사참고 옆 실험 중 표시
  const items = TABS.map(([k, l]) => `<button class="${k === cur ? "on" : ""}"${k === cur ? ' aria-current="page"' : ""} onclick="go('${k}')">${l}${k === "ask" ? FLASK : ""}</button>`);
  items.unshift(`<a href="map.html">예산지도</a>`);   // 가장 왼쪽: 사이트의 첫 화면
  document.getElementById("tabs").innerHTML = items.join("");
}
function go(k, push = true) { cur = k; drawTabs(); VIEWS[k](); window.scrollTo(0, 0); if (push) setHash("#" + k); }
// 주소(#탭 또는 #explore/세부사업ID)로 화면을 복원한다. 뒤로가기·새로고침·공유 링크 지원
function setHash(h) { if (location.hash !== h) history.pushState(null, "", h); }
function route() {
  let [k, id] = decodeURIComponent(location.hash.slice(1)).split("/");
  if (k === "explore" && id && P.some(p => p.id === id)) { cur = "explore"; drawTabs(); VIEWS.explore(); showProject(id); return; }
  k = ALIAS[k] || k;
  go(TABS.some(([t]) => t === k) ? k : "analysis", false);
}
window.addEventListener("popstate", route);
document.addEventListener("keydown", e => { if (e.key === "Escape") { const s = document.getElementById("sheet"); if (s) s.classList.remove("on"); } });
const VIEWS = {};
const view = html => document.getElementById("view").innerHTML = html;

function search(q, limit = 30) {
  const terms = q.trim().split(/\s+/).filter(Boolean);
  if (!terms.length) return [];
  return P.filter(p => {
    const hay = `${p.name} ${p.ministry} ${p.program || ""} ${p.activity || ""} ${p.field} ${p.sector || ""} ${(p.aka || []).join(" ")} ${(p.prev_ministry || []).join(" ")} ${p.pooled_from || ""} ${itemsOf(p).map(i => i.name).join(" ")}`;
    return terms.every(t => hay.includes(t));
  }).sort((a, b) => (curGov(b) || amt(b, PREV) || 0) - (curGov(a) || amt(a, PREV) || 0)).slice(0, limit);
}
const resultRow = p => `<div class="item">${link(p)}<br><span class="sub">${esc(p.field)} · ${CUR} 정부안 ${won(curGov(p))}억 · ${PREV} 확정 ${won(base(p))}억 · ${isNew(p) ? '<span class="warn">신규</span>' : pct(chg(p) * 100)}</span></div>`;

/* 설명 본문 전체 낱말 색인: 초성별 샤드 (desc/terms/<초성>.json.gz, scripts/shard_terms.py). 검색어에 필요한 샤드만 받는다 */
let PID_MAP = null;
const TERM_SH = {};
const choseong = t => { const c = t.charCodeAt(0) - 0xAC00; return c >= 0 && c < 11172 ? String(Math.floor(c / 588)) : "x"; };
async function termShard(k) {
  if (!(k in TERM_SH)) { const v = await gunzipJSON(`desc/terms/${k}.json.gz`).catch(() => null); if (v) TERM_SH[k] = v; else return {}; }
  return TERM_SH[k];
}
const projById = id => { if (!PID_MAP) PID_MAP = new Map(P.map(p => [p.id, p])); return PID_MAP.get(id); };
async function termHits(q) {
  const toks = (q.match(/[가-힣A-Za-z0-9]{2,}/g) || []);
  if (!toks.length) return [];
  let ids = null;
  for (const t of toks) {
    const T = await termShard(choseong(t));
    const list = T[t] || [];
    ids = ids === null ? list.slice() : ids.filter(x => list.includes(x));
    if (!ids.length) break;
  }
  return (ids || []).map(projById).filter(Boolean).sort((a, b) => (curGov(b) || 0) - (curGov(a) || 0));
}
async function descSearch(q, target) {
  if (!q || q.trim().length < 2) { target.innerHTML = ""; return; }
  target.innerHTML = `<div class="sub">설명 본문 검색 중…</div>`;
  const hits = (await termHits(q)).slice(0, 30);
  target.innerHTML = hits.length
    ? `<div class="sub">설명 본문에서 찾은 사업 ${hits.length}건 (금액 큰 순, 상위 30)</div>` + hits.map(resultRow).join("")
    : `<div class="sub">설명 본문에서도 찾지 못했습니다.</div>`;
}

/* ---------- 공통: 내역 · 사업 설명 · 심사 플래그 (필요할 때만 불러옴) ---------- */
let NAEYEOK_VAL = null, DESC_IDX_I = null, FLAGS = null;
const itemsOf = p => (NAEYEOK_VAL && NAEYEOK_VAL[p.ministry + "|" + p.name]) || [];
async function loadDescIdx() { if (!DESC_IDX_I) DESC_IDX_I = await fetch("desc/index.json").then(r => r.ok ? r.json() : Promise.reject()).catch(() => null); return DESC_IDX_I; }
async function loadFlags() { if (!FLAGS) FLAGS = await fetch("desc/flags.json").then(r => r.ok ? r.json() : Promise.reject()).catch(() => null); return FLAGS || {}; }
const gunzipJSON = async url => {
  const res = await fetch(url);
  if (!res.ok) throw new Error("http " + res.status);
  return new Response(res.body.pipeThrough(new DecompressionStream("gzip"))).json();
};
function descRecText(rec) {
  const out = [], bl = rec.blocks || [];
  const parts = bl.length && bl[0] && bl[0].file !== undefined ? bl.map(x => x.b) : [bl];
  parts.forEach(arr => arr.forEach(b => {
    if (typeof b === "string") out.push(b);
    else if (b && b.tbl) out.push(b.tbl.map(r => r.filter(c => c && c.trim()).join(" | ")).filter(Boolean).join("\n"));
  }));
  return out.join("\n");
}
// 줄바꿈: ○ ● ※ 같은 항목 표지와 "/ -" 구분을 줄 시작으로 바꾼다 (긴 한 문단을 읽기 좋게)
const splitLines = s => s.replace(/\s+\/\s+/g, "\n").replace(/\s*\/\s*-\s*/g, "\n- ").replace(/\s*([\u2460-\u2473])\s*/g, "\n$1 ").replace(/\s*([○●◎■□※▶])\s*/g, "\n$1 ").split("\n").map(x => x.trim()).filter(Boolean);
const linesHTML = s => splitLines(s).map(x => `<p class="${/^- /.test(x) ? "li" : ""}">${esc(x)}</p>`).join("");
const descBlockHTML = b => {
  if (typeof b === "string") {
    const t = b.trim();
    if (/^\d+\.\s*\S/.test(t)) return `<h3>${esc(b)}</h3>`;                      // 1. 사업 총괄 정보
    if (/^(\(\d+-\d+\)|\(\d+\)|\d+\)|[①-⑩])/.test(t)) return `<h4>${esc(b)}</h4>`;  // 1) · (1-1)
    return linesHTML(b);
  }
  if (b && b.tbl) {
    const rows = b.tbl.filter(r => r.some(c => c && c.trim()));
    if (!rows.length) return "";
    const cellHTML = c => splitLines(String(c)).map(esc).join("<br>");   // 표 칸도 본문과 같은 줄바꿈 규칙 (/, ○, 번호 항목)
    return `<div class="dtbl"><table>${rows.map((r, i) => `<tr>${r.map(c => i === 0 ? `<th>${esc(c)}</th>` : `<td>${cellHTML(c)}</td>`).join("")}</tr>`).join("")}</table></div>`;
  }
  return "";
};
async function openDesc(ministry, name) {
  let sheet = document.getElementById("sheet");
  if (!sheet) {
    sheet = document.createElement("div");
    sheet.id = "sheet"; sheet.className = "sheet";
    sheet.innerHTML = `<div class="sheet-bar"><b id="sheetTitle"></b><button id="sheetClose" aria-label="닫기">닫기</button></div><div class="sheet-body" id="sheetBody"></div>`;
    document.body.appendChild(sheet);
    document.getElementById("sheetClose").onclick = () => sheet.classList.remove("on");
  }
  document.getElementById("sheetTitle").textContent = name;
  const body = document.getElementById("sheetBody");
  body.innerHTML = `<p class="sub">불러오는 중…</p>`;
  sheet.classList.add("on");
  try {
    const idx = await loadDescIdx();
    if (!idx) throw new Error("index");
    const id = idx[ministry + "|" + name];
    if (!id) { body.innerHTML = `<p class="sub">이 사업의 설명 자료가 아직 없습니다.</p>`; return; }
    const rec = await gunzipJSON(`desc/${id}.json.gz`);
    const bl = rec.blocks || [];
    const parts = bl.length && bl[0] && bl[0].file !== undefined
      ? bl.map(x => `<div class="part"><div class="sub">${esc(x.file)}</div>${x.b.map(descBlockHTML).join("")}</div>`)
      : [bl.map(descBlockHTML).join("")];
    body.innerHTML = `<div class="sub">${esc(rec.ministry)} · ${CUR} 정부안 사업설명자료</div>${parts.join("")}`;
  } catch (e) {
    body.innerHTML = `<p class="sub">설명을 불러오지 못했습니다. 잠시 후 다시 눌러 주세요.</p>`;
  }
}

function openDescBtn(el) { openDesc(el.dataset.min, el.dataset.name); }

/* ---------- 1. 주요분석 (홈 + 한눈에 보기 통합) ---------- */
function byField(y, pick) {
  const m = {};
  P.forEach(p => { const v = pick(p, y); if (v) m[p.field] = (m[p.field] || 0) + v; });
  return m;
}
VIEWS.analysis = () => {
  const g = total(CUR, "gov"), n = total(PREV, "na");
  const top = P.filter(p => base(p) > 0 && curGov(p) > 0).sort((a, b) => diff(b) - diff(a)).slice(0, 5);
  const cut = P.filter(p => base(p) > 0).sort((a, b) => diff(a) - diff(b)).slice(0, 5);
  const fg = byField(CUR, (p, y) => Y(p, y).gov), fn = byField(PREV, (p, y) => Y(p, y).na);
  const sumG = Object.values(fg).reduce((a, b) => a + b, 0);
  const frows = Object.keys({ ...fg, ...fn }).map(k => [k, fg[k] || 0, fn[k] || 0]).sort((a, b) => b[1] - a[1]);
  const fmax = Math.max(...frows.map(r => r[1]));
  const funds = {};
  P.forEach(p => { const v = curGov(p); if (v && p.fund) { const k = p.fund.split("/")[0]; funds[k] = (funds[k] || 0) + v; } });
  const fundRows = Object.entries(funds).sort((a, b) => b[1] - a[1]).slice(0, 12);
  view(`
  <div class="card"><h2>${CUR}년 예산안 규모·증감</h2>
    <div class="kpis">
      <div class="kpi"><span>${CUR} 정부안 총지출</span><b>${jo(g)}원</b></div>
      <div class="kpi"><span>${PREV} 국회 확정 대비</span><b class="${g > n ? "up" : "down"}">${pct((g / n - 1) * 100)}</b></div>
      <div class="kpi"><span>증감액</span><b>${jo(g - n)}원</b></div>
      <div class="kpi"><span>세부사업</span><b>${P.filter(p => curGov(p) > 0).length.toLocaleString()}개</b></div>
    </div></div>
  <div class="card"><h2>사업 검색</h2>
    <input id="q" aria-label="사업 검색" placeholder="사업명·부처·내역사업 (예: 기초연금, 교육부 늘봄)" oninput="onSearchInput(this, document.getElementById('qr'), document.getElementById('qd'), 30)">
    <div id="qr" style="margin-top:6px"></div><div id="qd" style="margin-top:10px"></div></div>
  <div class="card"><h2>분야별 규모·증감 <span class="sub">(${CUR} 정부안, ${PREV} 확정 대비)</span></h2>
    <table><tr><th>분야</th><th>${CUR}</th><th>비중</th><th>증감</th></tr>
    ${frows.map(([k, a, b]) => `<tr><td>${esc(k)}<div class="bar" style="margin-top:4px"><i style="width:${(a / fmax * 100).toFixed(0)}%"></i></div></td>
      <td>${jo(a)}</td><td class="sub">${(a / sumG * 100).toFixed(1)}%</td><td class="${a > b ? "up" : "down"}">${pct((a / b - 1) * 100)}</td></tr>`).join("")}
    <tr><td><b>합계</b></td><td><b>${jo(sumG)}</b></td><td></td><td></td></tr></table></div>
  <div class="card"><h2>가장 많이 늘어난 사업 <span class="sub">(${PREV} 확정 → ${CUR} 정부안, 억원)</span></h2>
    ${top.map(p => `<div class="item">${link(p)}<br><span class="sub">${won(base(p))} → ${won(curGov(p))} (<span class="up">+${won(diff(p))}</span>, ${pct(chg(p) * 100)})</span></div>`).join("")}</div>

function seriesChartHTML(d) {
  const ys = d.years, S = d.series;
  const all = S.flatMap(s => ys.map(y => s.values[y]).filter(v => v != null && isFinite(v)));
  if (!all.length) return `<p class="sub">표시할 값이 없습니다.</p>`;
  const lo = Math.min(0, ...all), hi = Math.max(...all), span = (hi - lo) || 1;
  const W = 640, H = 260, L = 56, R = 16, T = 14, B = 30;
  const x = i => L + (ys.length === 1 ? (W - L - R) / 2 : i * (W - L - R) / (ys.length - 1));
  const y = v => T + (H - T - B) * (1 - (v - lo) / span);
  const grid = [0, 0.25, 0.5, 0.75, 1].map(t => { const v = lo + span * t; return `<line x1="${L}" x2="${W - R}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)"/><text x="${L - 6}" y="${y(v) + 4}" text-anchor="end" font-size="18" fill="var(--sub)">${esc(String(Math.round(v)))}</text>`; }).join("");
  const xl = ys.map((yr, i) => `<text x="${x(i)}" y="${H - 8}" text-anchor="middle" font-size="18" fill="var(--sub)">${yr}</text>`).join("");
  const lines = S.map((s, k) => {
    const c = SERIES_COLORS[k % SERIES_COLORS.length];
    const pts = ys.map((yr, i) => s.values[yr] != null ? [x(i), y(s.values[yr])] : null).filter(Boolean);
    return `<polyline fill="none" stroke="${c}" stroke-width="2" points="${pts.map(p => p.join(",")).join(" ")}"/>` +
      pts.map(p => `<circle cx="${p[0]}" cy="${p[1]}" r="3" fill="${c}"/>`).join("");
  }).join("");
  const legend = S.length > 1 ? `<div class="sub" style="margin-top:6px">${S.map((s, k) => `<span style="color:${SERIES_COLORS[k % SERIES_COLORS.length]}">■</span> ${esc(s.name)}`).join("&nbsp;&nbsp;")}</div>` : "";
  const table = `<table><tr><th>구분</th>${ys.map(yr => `<th>${yr}</th>`).join("")}</tr>${S.map(s =>
    `<tr><td>${esc(s.name)}</td>${ys.map(yr => `<td>${s.values[yr] != null ? esc(won(s.values[yr])) : "-"}</td>`).join("")}</tr>`).join("")}</table>`;
  const src = d.source ? `<div class="sub" style="margin-top:8px">출처: ${esc(d.source)} · 단위 ${esc(d.unit || "")}</div>` : "";
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(d.title)} 차트">${grid}${xl}${lines}</svg>${legend}${table}${src}`;
}

function bnMorph(card, box, back) {

  <div class="card"><h2>조건을 문장으로 입력</h2>
    <div class="row"><input id="cond" aria-label="조건 문장" placeholder="예: 교육부 집행률 80% 미만 증가율 10% 이상" onkeydown="if(event.key==='Enter')runFilter()"><button class="go" onclick="runFilter()">찾기</button></div>
    <div class="sub" style="margin-top:8px">인식하는 조건: 분야명·부처명, "증가율 N% 이상/이하", "집행률 N% 미만/이상"(최근 결산), "감소율 N% 이상", "N억 이상/이하"(${CUR} 정부안), "신규", "미편성", 그 밖의 단어는 사업명 검색</div>
    <div id="fres" style="margin-top:12px"></div></div>`);
};
async function runFilter() {
  await naeyeokData();
  let s = document.getElementById("cond").value;
  const conds = [], desc = [];
  const num = re => { const m = s.match(re); if (m) s = s.replace(m[0], " "); return m ? +m[1].replace(/,/g, "") : null; };
  const up = num(/증가율\s*(\d+)\s*%\s*이상/), upMax = num(/증가율\s*(\d+)\s*%\s*이하/), cut = num(/감소율\s*(\d+)\s*%\s*이상/);
  const amin = num(/([\d,]+)\s*억\s*(?:원)?\s*이상/), amax = num(/([\d,]+)\s*억\s*(?:원)?\s*이하/);
  const exLow = num(/집행률\s*(\d+)\s*%\s*(?:미만|이하)/), exHigh = num(/집행률\s*(\d+)\s*%\s*이상/);
  if (exLow != null) { conds.push(p => { const e = Eb(p, EXEC_LAST); return e && e.rate != null && e.rate < exLow; }); desc.push(`${EXEC_LAST} 집행률 < ${exLow}% (금융·내부거래 제외)`); }
  if (exHigh != null) { conds.push(p => { const e = Eb(p, EXEC_LAST); return e && e.rate != null && e.rate >= exHigh; }); desc.push(`${EXEC_LAST} 집행률 ≥ ${exHigh}% (금융·내부거래 제외)`); }
  if (up != null) { conds.push(p => chg(p) * 100 >= up); desc.push(`증가율 ≥ ${up}%`); }
  if (upMax != null) { conds.push(p => chg(p) * 100 <= upMax); desc.push(`증가율 ≤ ${upMax}%`); }
  if (cut != null) { conds.push(p => chg(p) * -100 >= cut); desc.push(`감소율 ≥ ${cut}%`); }
  if (amin != null) { conds.push(p => (curGov(p) || 0) >= amin); desc.push(`${CUR} 정부안 ≥ ${amin}억`); }
  if (amax != null) { conds.push(p => (curGov(p) || 0) <= amax); desc.push(`${CUR} 정부안 ≤ ${amax}억`); }
  if (/신규/.test(s)) { conds.push(isNew); desc.push("신규"); s = s.replace(/신규(\s*사업)?/, " "); }
  if (/미편성|폐지/.test(s)) { conds.push(isGone); desc.push("미편성"); s = s.replace(/미편성|폐지/, " "); }
  const fields = [...new Set(P.map(p => p.field))], mins = [...new Set(P.map(p => p.ministry))];
  const m = mins.sort((a, b) => b.length - a.length).find(x => s.includes(x)); if (m) { conds.push(p => p.ministry === m); desc.push(`소관=${m}`); s = s.replace(m, " "); }
  const f = fields.sort((a, b) => b.length - a.length).find(x => s.includes(x)); if (f) { conds.push(p => p.field === f); desc.push(`분야=${f}`); s = s.replace(f, " "); }
  const words = s.replace(/분야|사업|중에?|이고|그리고|인|및/g, " ").split(/\s+/).filter(w => w.length >= 2);
  words.forEach(w => { conds.push(p => `${p.name} ${p.program || ""} ${p.activity || ""}`.includes(w) || itemsOf(p).some(i => i.name.includes(w))); desc.push(`"${w}" 포함`); });
  const res = conds.length ? P.filter(p => conds.every(c => c(p))).sort((a, b) => Math.abs(diff(b)) - Math.abs(diff(a))) : [];
  document.getElementById("fres").innerHTML = conds.length
    ? `<div class="sub">해석: ${desc.map(esc).join(" · ")} → ${res.length.toLocaleString()}건 (증감 규모순 상위 50)</div>` + res.slice(0, 50).map(resultRow).join("")
    : "<div class='sub'>조건을 인식하지 못했습니다.</div>";
}

/* ---------- 6. AI에게 묻기 ---------- */
VIEWS.ask = () => {
  view(`
  <div class="card"><h2>국회 검토 문서 기반 질문</h2>
    ${HAS_DOCS ? "" : '<div class="doc">국회 검토보고서는 아직 연결되지 않아, 지금은 <b>예산·결산 수치와 사업설명자료</b>를 근거로 찾아 드립니다.</div>'}
    <div class="row"><input id="aq" aria-label="질문" placeholder="예: 늘봄학교 예산은 얼마나 늘었나?" onkeydown="if(event.key==='Enter')ask()"><button class="go" onclick="ask()">질문</button></div>
    <div class="sub" style="margin-top:10px">AI 요약 답변은 API 토큰 예산 확보 시 추가될 예정입니다.</div>
    <div id="ans" style="margin-top:12px"></div></div>`);
};
const STOP = /(은|는|이|가|을|를|의|에|와|과|도|로|으로|얼마나|얼마|어떻게|무엇|있나요|늘었나|줄었나|예산|사업|\?)$/;
function retrieve(q) {
  const terms = q.split(/[\s,?.!]+/).map(t => t.replace(STOP, "")).filter(t => t.length >= 2);
  return P.map(p => {
    const hay = `${p.name} ${p.program || ""} ${p.activity || ""} ${p.ministry} ${(p.docs || []).map(d => d.text).join(" ")} ${itemsOf(p).map(i => i.name).join(" ")}`;
    return { p, score: terms.reduce((a, t) => a + (hay.includes(t) ? (p.name.includes(t) ? 2 : 1) : 0), 0) };
  }).filter(x => x.score > 0).sort((a, b) => b.score - a.score || (curGov(b.p) || 0) - (curGov(a.p) || 0)).slice(0, 5);
}
const fact = p => `${p.ministry} ${p.program || ""} > ${p.name}: ` + YEARS.map(y => { const v = Y(p, y); return `${y} 정부안 ${won(v.gov)}억, 확정 ${won(v.na)}억`; }).join("; ")
  + ((D.exec_years || []).some(y => E(p, y)) ? ` / 소속 단위사업 '${unitOf(p) ? unitOf(p).activity : ""}' 결산: ` + D.exec_years.map(y => { const e = E(p, y); return e ? `${y} 집행률 ${e.rate == null ? "-" : e.rate.toFixed(1) + "%"}, 불용 ${won(e.unused)}억` : ""; }).filter(Boolean).join("; ") : "");
async function ask() {
  const q = document.getElementById("aq").value.trim(); if (!q) return;
  await naeyeokData();
  const got = retrieve(q), box = document.getElementById("ans");
  const extra = (await termHits(q)).filter(p => !got.some(h => h.p === p)).slice(0, 3).map(p => ({ p, score: 0 }));
  const hits = [...got, ...extra].slice(0, 6);
  if (!hits.length) { box.innerHTML = "<div class='sub'>관련 사업을 찾지 못했습니다.</div>"; return; }
  const DI = (await loadDescIdx()) || {};
  const texts = await Promise.all(hits.map(async ({ p }) => {
    const id = DI[p.ministry + "|" + p.name];
    if (!id) return "";
    try { return descRecText(await gunzipJSON(`desc/${id}.json.gz`)).slice(0, 1500); } catch (e) { return ""; }
  }));
  const cite = hits.map(({ p }, i) => `<div class="doc">${link(p)}${texts[i] ? ' <span class="tag">사업설명 있음</span>' : ""}<br><span class="sub">출처: 열린재정 총지출 세부사업 · ${YEARS.map(y => `${y} ${won(amt(p, y))}`).join(" → ")}억</span>
    ${DI[p.ministry + "|" + p.name] ? `<br><button class="desc-btn" data-min="${esc(p.ministry)}" data-name="${esc(p.name)}" onclick="openDescBtn(this)">사업 설명 보기 ›</button>` : ""}</div>`).join("");
  box.innerHTML = `<div class="sub">관련 사업</div>${cite}`;
}

/* ---------- 7. 삶의 질 지표 ---------- */
VIEWS.quality = () => {
  view(`<div class="card"><h2>229개 시군구 삶의 질 지표</h2>
    <div class="sub">시군구 지표는 별도 프로젝트 <a href="https://lloydknam.github.io/life-stats/">클사무관의 라이프 인덱스</a>에서 볼 수 있습니다.</div></div>`);
};

route();
</script>
