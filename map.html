<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>클사무관의 예산 네비 · 예산 지도</title>
<link rel="icon" href="assets/clerk.jpg">
<meta name="theme-color" content="#0a0c10">
<link rel="preconnect" href="https://cdn.jsdelivr.net">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
:root{color-scheme:dark;--bg:#0a0c10;--card:#0e1217;--ink:#fff;--sub:#8a909c;--line:#20252d;--accent:#28cc95;
  --d0:#4fb3ec;--d0f:#04243d;--d1:#8fd2f7;--d1f:#04243d;--d2:#c6ebfc;--d2f:#0b2a4a;
  --dm:#e6e2f5;--dmf:#2a2740;
  --u2:#fff1b8;--u2f:#5a4300;--u1:#ffd08a;--u1f:#5c3300;--u0:#f9a8d4;--u0f:#5a0d35}
*{box-sizing:border-box}
html,body{height:100%;margin:0;overflow:hidden}
body{background:var(--bg);color:var(--ink);font:14px/1.45 "Pretendard Variable",Pretendard,system-ui,-apple-system,"Malgun Gothic",sans-serif;display:flex;flex-direction:column;height:100vh;height:100dvh;padding:env(safe-area-inset-top) 12px env(safe-area-inset-bottom)}
button{font:inherit;color:inherit}
.brand{flex:none;display:flex;align-items:center;gap:9px;padding:8px 0 0;text-decoration:none;color:inherit}
.brand img{width:30px;height:30px;border-radius:50%;object-fit:cover;border:1.5px solid var(--line)}
.brand b{font-size:17px;font-weight:800;letter-spacing:-.04em}
.brand b em{font-style:normal;color:var(--accent)}
.brand span{font-size:13px;font-weight:700;background:linear-gradient(90deg,#f0527f,#b56cf0 55%,#4c8dff);-webkit-background-clip:text;background-clip:text;color:transparent}
/* 검색 */
.app{flex:1 1 auto;min-height:0;width:100%;max-width:960px;margin:0 auto;padding:0 4px;display:flex;flex-direction:column;overflow-y:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;scrollbar-width:none}
.app::-webkit-scrollbar{display:none}
.ghead{flex:none;display:flex;flex-wrap:wrap;align-items:center;gap:10px 16px;padding:6px 0 2px;margin-left:-6px}
.ghead .brand{flex:none;display:flex;align-items:center;gap:12px;text-decoration:none;color:inherit}
.ghead .brand img{width:46px;height:46px;border-radius:50%;object-fit:cover;border:2px solid var(--line)}
.ghead h1{margin:0;font-size:20px;font-weight:800;letter-spacing:-.04em;line-height:1.1;white-space:nowrap}
.ghead h1 em{font-style:normal;color:var(--accent)}
.hsearch{position:relative;flex:0 1 340px;width:340px;max-width:100%;min-width:0}
.hsearch::before{content:"";position:absolute;left:15px;top:50%;width:12px;height:12px;margin-top:-7px;border:2px solid var(--accent);border-radius:50%;pointer-events:none;z-index:1}
.hsearch::after{content:"";position:absolute;left:25px;top:calc(50% + 4px);width:6px;height:2px;background:var(--accent);transform:rotate(45deg);transform-origin:left center;pointer-events:none;z-index:1}
.hsearch input{width:100%;box-sizing:border-box;height:40px;border:2px solid var(--accent);background:var(--card);color:var(--ink);border-radius:8px;padding:0 38px;font-size:15px;font-family:inherit;outline:none}
.hsearch input::placeholder{color:var(--sub)}
.hsearch input:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.hsearch input::-webkit-search-cancel-button{display:none}
.hsearch .clr{position:absolute;right:7px;top:50%;transform:translateY(-50%);border:0;background:var(--line);color:var(--ink);width:26px;height:26px;border-radius:50%;cursor:pointer;font-size:15px;line-height:1}
@media (max-width:640px){.hsearch{flex:1 1 100%;width:auto}}
@media (min-width:641px){.ghead .brand img{width:56px;height:56px}.ghead h1{font-size:27px}}
.gnav{flex:none;display:flex;gap:22px;align-items:center;overflow-x:auto;padding:6px 0;border-bottom:1px solid var(--line);margin-bottom:2px;scrollbar-width:none}
.gnav::-webkit-scrollbar{display:none}
.gnav a{flex:none;font-size:17px;font-weight:600;letter-spacing:-.01em;color:var(--sub);text-decoration:none;padding:4px 0}
.gnav a:hover{color:var(--ink)}
.gnav a.here{font-weight:700;background:linear-gradient(90deg,#f0527f,#b56cf0 55%,#4c8dff);-webkit-background-clip:text;background-clip:text;color:transparent}
.head{flex:none;display:flex;align-items:center;gap:10px;padding-top:2px}
.head .brand{flex:none}
.head .search{flex:1;min-width:0;position:relative;padding:0}
.search{flex:none;position:relative;padding:4px 0 2px}
.search input{width:100%;box-sizing:border-box;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;padding:9px 14px 9px 36px;font-size:14px;font-family:inherit;outline:none}
.search input::placeholder{color:var(--sub)}
.search input:focus-visible{outline:3px solid var(--accent);outline-offset:-1px}
.search::before{content:"";position:absolute;left:14px;top:50%;width:12px;height:12px;margin-top:-5px;border:2px solid var(--sub);border-radius:50%;pointer-events:none}
.search::after{content:"";position:absolute;left:24px;top:calc(50% + 5px);width:6px;height:2px;background:var(--sub);transform:rotate(45deg);transform-origin:left center;pointer-events:none}
.search .clr{position:absolute;right:6px;top:50%;transform:translateY(-50%);border:0;background:var(--line);color:var(--ink);width:24px;height:24px;border-radius:50%;cursor:pointer;font-size:14px;line-height:1}
.rowbtn .path{display:block;font-size:11px;color:var(--sub);font-weight:400;word-break:keep-all;margin-top:1px}
/* 상단: 연도 + 합계 */
.top{flex:none;display:flex;align-items:center;gap:8px;padding:8px 0 6px}
.top .t{flex:1;min-width:0}
.top .t b{font-size:13.8px;font-weight:800;letter-spacing:-.02em;font-variant-numeric:tabular-nums;white-space:nowrap}
.top .t span{display:block;font-size:12px;color:var(--sub);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.years{flex:none;display:flex;border:1px solid var(--line);border-radius:999px;background:var(--card);padding:2px}
.years button{border:0;background:none;padding:5px 8px;border-radius:999px;font-size:12.5px;color:var(--sub);cursor:pointer;line-height:1.2;font-variant-numeric:tabular-nums}
.years button.on{background:var(--ink);color:var(--bg)}
/* 경로 */
.crumb{flex:none;display:flex;align-items:flex-start;gap:8px;min-height:34px}
.crumb ol{list-style:none;margin:0;padding:2px 0;display:grid;grid-auto-flow:column;grid-auto-columns:auto;justify-content:start;gap:0 16px;overflow:hidden;min-width:0;flex:1;white-space:nowrap}
.crumb .cl,.crumb .cn,.crumb .ca{display:block;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.crumb ol::-webkit-scrollbar{display:none}
.crumb li{display:flex;min-width:0}
.crumb li button{display:flex;flex-direction:column;align-items:flex-start;gap:1px;border:0;background:none;padding:2px 0;cursor:pointer;font-family:inherit;text-align:left;color:var(--ink)}
.crumb .cl{font-size:10.5px;font-weight:700;color:var(--accent);line-height:1.3}
.crumb .cn{font-size:13.5px;font-weight:600;color:var(--ink);line-height:1.3}
.crumb .ca{font-size:11px;color:var(--sub);font-variant-numeric:tabular-nums;line-height:1.3}
.crumb li:last-child button{cursor:default}
.crumb li:last-child .cn{font-weight:800}
@media (max-width:640px){.crumb ol{overflow:hidden;grid-auto-columns:auto;gap:0 8px}.crumb li{min-width:0}.crumb li button{max-width:100%;min-width:0}.crumb .cl,.crumb .cn,.crumb .ca{display:block;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}}
.crumb .lv{flex:none;font-size:11px;color:var(--accent);font-weight:700;padding:2px 7px;border-radius:999px;background:var(--card);border:1px solid var(--line)}
/* 본문: 남은 높이를 전부 씀 */
.stage{flex:none;height:max(380px,calc(100dvh - 200px));position:relative;margin:4px 0 6px;border-radius:14px;overflow:hidden}
.map{position:absolute;inset:0}
.tile{position:absolute;margin:0;border:2px solid var(--bg);border-radius:12px;padding:8px 9px;text-align:left;cursor:pointer;overflow:hidden;line-height:1.2;-webkit-tap-highlight-color:transparent}
.tile b{display:block;font-size:12.5px;font-weight:700;word-break:keep-all;overflow-wrap:anywhere}
.tile.mini{padding:2px 3px;line-height:1.15}.tile.mini b{font-size:9px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;word-break:normal;overflow-wrap:normal}
.tile span{display:block;font-size:11px;font-variant-numeric:tabular-nums;opacity:.92;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tile.big b{font-size:17px}.tile.big span{font-size:13px}
.tile.tiny{padding:0;border-width:1px;border-radius:4px}
.tile.mid{border-radius:8px;padding:5px 6px}
.tile:focus-visible,.rowbtn:focus-visible,.years button:focus-visible,.crumb button:focus-visible,.seg button:focus-visible,.back:focus-visible{outline:3px solid var(--accent);outline-offset:-2px;z-index:3}
.c-d0{background:var(--d0);color:var(--d0f)}.c-d1{background:var(--d1);color:var(--d1f)}.c-d2{background:var(--d2);color:var(--d2f)}
.c-m{background:var(--dm);color:var(--dmf)}
.c-u2{background:var(--u2);color:var(--u2f)}.c-u1{background:var(--u1);color:var(--u1f)}.c-u0{background:var(--u0);color:var(--u0f)}
/* 트리 보기: 가로 스크롤, 베지에 곡선, 가지 굵기·그라데이션, 경로 강조 */
.tree{position:absolute;inset:0;background:var(--card);border-radius:14px;overflow:auto;-webkit-overflow-scrolling:touch}
.tree svg{display:block}
.tree .lk{fill:none;stroke-linecap:round;transition:opacity .2s,stroke .2s}
.tree .tn circle{transition:fill .2s,stroke .2s}
.tree .tn text{font-size:13px;font-weight:600;fill:var(--ink);paint-order:stroke;stroke:var(--card);stroke-width:4px;stroke-linejoin:round;cursor:pointer;font-family:inherit}
.tree .tn text.am{font-size:12px;font-weight:600;fill:#facc15;font-variant-numeric:tabular-nums}
.tree .tn text.more{fill:var(--sub);font-weight:500}
.tree svg.hl .lk{opacity:.16}
.tree svg.hl .lk.on{opacity:1;stroke:var(--accent)}
.tree svg.hl .tn{opacity:.3}
.tree svg.hl .tn.on{opacity:1}
.tree svg.hl .tn.on circle{stroke:var(--accent)}
/* PC에서 마우스로 끌어서 옮기기 (손가락은 기본 스크롤) */
.tree{cursor:grab;user-select:none;-webkit-user-select:none}
.tree.dragging{cursor:grabbing}
/* 트리 펼치기: 새로 나온 가지는 부모 쪽에서 오른쪽으로 미끄러지듯 나타난다 (fill backwards: 평소 강조 상태를 건드리지 않음) */
.tree .tn.in{animation:tFade .35s ease 1.06s backwards}
.tree .lk.in{animation:lIn 1.06s ease backwards}
.tree .tn.out{animation:tOut 1.2s ease forwards !important;pointer-events:none}
.tree .lk.out{animation:lOut 1.2s ease forwards !important;pointer-events:none}
@keyframes tOut{from{opacity:1;transform:none}to{opacity:0;transform:translateX(-26px)}}
@keyframes lOut{from{opacity:1}to{opacity:0}}
@keyframes tFade{from{opacity:0}to{opacity:1}}
@keyframes lIn{from{opacity:0;stroke-dasharray:1;stroke-dashoffset:1}to{opacity:1;stroke-dasharray:1;stroke-dashoffset:0}}
@media (prefers-reduced-motion: reduce){.tree .tn.in,.tree .lk.in{animation:none}}
/* 트리 보기에서는 위쪽 경로(부처·분야·부문) 줄을 숨겨 공간을 확보 */
body.tree-mode .crumb{display:none}
/* 목록 보기 */
.seg{position:absolute;top:8px;right:8px;z-index:4;display:flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--card)}
#lvname .seg{position:static;flex:none}
.seg button{border:0;background:none;padding:4px 9px;font-size:12px;color:var(--sub);cursor:pointer}
.seg button.on{background:var(--ink);color:var(--bg)}
.list{background:var(--card);border-radius:14px;position:absolute;inset:0;overflow-y:auto;padding:0;-webkit-overflow-scrolling:touch}
.rowbtn{display:grid;grid-template-columns:10px 1fr auto;gap:0 10px;align-items:center;width:100%;border:0;border-bottom:1px solid var(--line);background:none;text-align:left;padding:5px 12px;cursor:pointer}
.rowbtn .sw{width:10px;height:10px;border-radius:2px}
.rowbtn .nm{font-size:13.5px;font-weight:600;word-break:keep-all;line-height:1.3}
.rowbtn .am{font-size:12.5px;font-variant-numeric:tabular-nums;text-align:right;white-space:nowrap}
.rowbtn .am small{display:inline;color:var(--sub);font-size:11px;margin-left:4px}
.rowbtn .bar{grid-column:2 / 4;height:3px;background:var(--line);border-radius:2px;overflow:hidden}
.rowbtn .bar i{display:block;height:100%;background:var(--sub)}
/* 작은 칸 라벨 (오른쪽 여백) · 말풍선 */
.map svg.lead{position:absolute;left:0;top:0;width:100%;height:100%;pointer-events:none;overflow:visible}
.map svg.lead polyline{fill:none;stroke:var(--ink);stroke-width:1.3;opacity:.7}
.callout{position:absolute;border:0;background:none;padding:0;text-align:left;cursor:pointer;color:var(--ink);font-size:10px;line-height:1.3;word-break:keep-all}
.callout b{display:block;font-size:10.5px;font-weight:700;word-break:keep-all;overflow-wrap:anywhere}
.callout span{display:block;white-space:nowrap;font-size:9.5px;color:var(--sub);font-variant-numeric:tabular-nums;white-space:nowrap}
.bubble{position:absolute;z-index:8;border:0;border-radius:8px;padding:6px 9px;background:var(--ink);color:var(--bg);font-size:12px;line-height:1.35;text-align:left;cursor:pointer;max-width:170px;box-shadow:0 6px 18px rgba(0,0,0,.35);font-variant-numeric:tabular-nums}
.bubble b{display:block;font-size:12.5px}
/* 사업 설명 */
.desc-btn{margin-top:4px;align-self:flex-start;border:1px solid var(--line);background:var(--card);color:var(--accent);font-weight:700;font-size:13px;border-radius:999px;padding:7px 14px;cursor:pointer}
.sheet{position:fixed;left:50%;width:min(960px,100vw);bottom:0;height:82dvh;background:var(--bg);border-top:1px solid var(--line);border-radius:16px 16px 0 0;box-shadow:0 -10px 30px rgba(0,0,0,.4);transform:translate(-50%,105%);transition:transform .35s cubic-bezier(.16,1,.3,1);z-index:30;display:flex;flex-direction:column}
.sheet.on{transform:translate(-50%,0)}
.sheet-bar{flex:none;display:flex;align-items:center;justify-content:space-between;gap:10px;padding:14px 16px 10px;border-bottom:1px solid var(--line)}
.sheet-bar b{font-size:16px;line-height:1.3;word-break:keep-all}
.sheet-bar button{flex:none;border:0;background:var(--card);color:var(--ink);border-radius:999px;padding:6px 12px;cursor:pointer;font-size:13px}
.sheet-body{flex:1 1 auto;overflow-y:auto;padding:12px 16px 24px;-webkit-overflow-scrolling:touch;font-size:13.5px;line-height:1.6}
.sheet-body h4{margin:16px 0 6px;font-size:14px;font-weight:700;color:var(--accent);line-height:1.4;word-break:keep-all}
.sheet-body p{margin:4px 0;word-break:keep-all}
.sheet-body .part{margin-top:16px;padding-top:12px;border-top:1px dashed var(--line)}
.sheet-body .dtbl{overflow-x:auto;margin:8px 0}
.sheet-body table{border-collapse:collapse;font-size:12px;width:100%}
.sheet-body th,.sheet-body td{border:1px solid var(--line);padding:4px 6px;text-align:left;vertical-align:top;word-break:keep-all}
.sheet-body th{color:var(--sub);font-weight:600;background:var(--card)}
/* 세부사업 상세 */
.detail{background:var(--card);border-radius:14px;position:absolute;inset:0;padding:14px 14px 14px;display:flex;flex-direction:column;gap:10px;overflow-x:hidden;overflow-y:auto;-webkit-overflow-scrolling:touch}
.detail>*{flex:none}
.detail h2{margin:0;font-size:18px;line-height:1.3;letter-spacing:-.01em;word-break:keep-all}
.detail .meta{font-size:12.5px;color:var(--sub)}
.detail dl{display:grid;grid-template-columns:auto 1fr;gap:3px 12px;margin:0;font-size:12.5px}
.detail dt{color:var(--sub)}.detail dd{margin:0;word-break:keep-all}
.detail table{width:100%;border-collapse:collapse;font-size:12.5px;font-variant-numeric:tabular-nums}
.detail th,.detail td{padding:4px 2px;border-bottom:1px solid var(--line);text-align:right;font-weight:400}
.detail th{color:var(--sub);font-size:11.5px}
.detail th:first-child,.detail td:first-child{text-align:left}
.detail td.b{width:30%;padding-left:8px}
.detail td.b i{display:block;height:6px;background:var(--accent);border-radius:0 3px 3px 0;min-width:1px}
.detail .sub-h{font-size:12px;color:var(--sub)}
.detail .items{max-height:45%;overflow-y:auto;border-top:1px solid var(--line)}
.detail .empty{font-size:12.5px;color:var(--sub);background:var(--bg);border-radius:8px;padding:8px 10px}
.detail h2.go-title{cursor:pointer}
.go-hint{font-size:11.5px;font-weight:600;color:var(--accent);margin-left:4px;vertical-align:middle}
/* 세부사업 카드 머리: 사업명 왼쪽, 닫기 버튼 오른쪽 끝 (녹색 타원) */
.dhead{display:flex;align-items:center;justify-content:space-between;gap:10px}
.dhead h2{margin:0;min-width:0}
.dclose{flex:none;border:2px solid var(--accent);background:transparent;color:var(--accent);font:inherit;font-size:14px;font-weight:800;line-height:1;padding:8px 16px;border-radius:999px;cursor:pointer;box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 18%,transparent)}
.dclose:hover,.dclose:focus-visible{background:var(--accent);color:#04241a;outline:none}
.rowbtn.go:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
.detail .dcard{border-top:1px solid var(--line);padding-top:10px}
.detail .dbody{font-size:12.5px;line-height:1.6;margin-top:4px}
.detail .dbody p{margin:3px 0;word-break:keep-all}
.detail .dbody p.li{padding-left:12px;text-indent:-9px}
.dtbl td span{display:block}
.dtbl td span.li{padding-left:12px;text-indent:-9px}
.dtbl td span.o{font-weight:700;margin-top:6px}
.detail .dbody p.o{font-weight:700;margin-top:14px}
.sheet-body p.o{font-weight:700;margin-top:14px}
.sheet-body p.li{padding-left:12px;text-indent:-9px}
.detail .dbody h3{margin:18px 0 6px;font-size:15.5px;font-weight:800;color:var(--accent);line-height:1.35;word-break:keep-all}
.detail .dbody h4{margin:12px 0 4px;font-size:13.5px;font-weight:700;color:var(--accent);line-height:1.4;word-break:keep-all}
.detail .dbody h5{margin:10px 0 4px;font-size:13px;font-weight:700;color:var(--ink);line-height:1.4;word-break:keep-all}
.sheet-body h3{margin:18px 0 6px;font-size:15.5px;font-weight:800;color:var(--accent);line-height:1.35;word-break:keep-all}
.sheet-body h5{margin:12px 0 4px;font-size:13px;font-weight:700;color:var(--ink);line-height:1.4;word-break:keep-all}
.detail .dbody .dtbl{overflow-x:auto;margin:6px 0}
.detail .dbody table{border-collapse:collapse;font-size:11.5px;width:100%}
.detail .dbody th,.detail .dbody td{border:1px solid var(--line);padding:3px 5px;text-align:left;vertical-align:top;word-break:keep-all;font-weight:400}
.detail .dbody th{color:var(--sub);font-weight:600;background:var(--bg)}
.detail .dbody .part{margin-top:12px;padding-top:10px;border-top:1px dashed var(--line)}
.detail .dbody .hit{background:rgba(40,204,149,.12);box-shadow:inset 3px 0 0 var(--accent);padding:2px 6px;margin:4px -6px;border-radius:6px}
/* 하단 */
.foot{flex:none;display:flex;flex-direction:column;align-items:center;gap:12px;font-size:12px;color:var(--sub);padding:28px 2px 48px}
.foot .lab img{display:block;height:48px;width:auto}
.foot .src{display:flex;align-items:center;justify-content:center;gap:5px;white-space:nowrap}
.foot .src i{flex:none;width:10px;height:9px;border-radius:2px;display:block}
.foot .src .sc{display:flex;gap:2px}
.bar{flex:none;position:sticky;bottom:0;z-index:5;display:grid;grid-template-columns:1fr 1fr 1fr minmax(0,2fr) auto;margin:0 -4px;padding:0 6px 2px;border-top:1px solid var(--line);background:var(--bg)}
.bar button{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;min-height:36px;border:0;background:none;color:var(--sub);font-size:10px;font-weight:600;cursor:pointer;border-radius:10px;-webkit-tap-highlight-color:transparent}
.bar svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}

<script src="data/budget.js"></script>
<script>
"use strict";
const D = window.BUDGET, PK = D.packed;
const YEARS = PK.years;
// 국회 확정 합계가 있는 연도는 확정액만, 없는 연도(심의 중)는 정부안
const CONFIRMED = {};
YEARS.forEach(y => CONFIRMED[y] = !!(D.totals[y] && D.totals[y].na > 0));
const LEVELS_FIELD = ["분야", "부문", "프로그램", "단위사업", "세부사업", "내역사업"];
const LEVELS_MIN = ["부처", "분야", "부문", "프로그램", "단위사업", "세부사업", "내역사업"];
let view = "field";   // field: 분야별로 시작 | ministry: 부처별로 시작
const LEVELS_FUND = ["회계·기금", "분야", "부문", "프로그램", "단위사업", "세부사업", "내역사업"];
const LEVELS = () => view === "ministry" ? LEVELS_MIN : view === "fund" ? LEVELS_FUND : LEVELS_FIELD;
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

/* ---------- 계층 만들기 (시작 기준별로 한 번씩) ---------- */
function node(name, sub) { return { name, sub: sub || "", v: {}, kids: new Map(), raw: null }; }
function buildTree(kind) {
  const root = node("총지출");
  const K = PK.keys, d = PK.dicts, nk = K.length, ix = {};
  K.forEach((k, i) => ix[k] = i);
  for (const r of PK.rows) {
    const amt = {};
    let any = false;
    YEARS.forEach((y, j) => {
      const g = r[nk + 1 + j * 2], n = r[nk + 2 + j * 2];
      const v = CONFIRMED[y] ? (n || 0) : (g || 0);
      if (v > 0) { amt[y] = v; any = true; }
    });
    if (!any) continue;
    const ministry = d.ministry[r[ix.ministry]];
    const field = d.field[r[ix.field]], sector = d.sector[r[ix.sector]], fund = d.fund[r[ix.fund]];
    const program = d.program[r[ix.program]], activity = d.activity[r[ix.activity]];
    // 분야별: 분야 > 부문 > 프로그램(소관별) > 단위사업   /  부처별: 소관 > 분야 > 부문 > 프로그램 > 단위사업
    // 회계기금별: 회계·기금 > 분야 > 부문 > 프로그램(소관 표시) > 단위사업
    const path = kind === "ministry"
      ? [[ministry, ""], [field, ""], [sector, ""], [program, ""], [activity, ""]]
      : kind === "fund"
        ? [[fund, ""], [field, ""], [sector, ""], [program, ministry], [activity, ""]]
        : [[field, ""], [sector, ""], [program, ministry], [activity, ""]];
    let cur = root;
    add(cur, amt);
    for (const [nm, sub] of path) {
      const key = nm + "\u0001" + sub;
      let c = cur.kids.get(key);
      if (!c) { c = node(nm, sub); cur.kids.set(key, c); }
      add(c, amt); cur = c;
    }
    const leaf = node(r[nk], "");
    leaf.v = amt; leaf.leaf = true;
    leaf.raw = { ministry, fund: d.fund[r[ix.fund]], gov: {}, na: {} };
    YEARS.forEach((y, j) => { leaf.raw.gov[y] = r[nk + 1 + j * 2]; leaf.raw.na[y] = r[nk + 2 + j * 2]; });
    cur.kids.set(cur.kids.size + "\u0001" + r[nk], leaf);
  }
  function add(n, amt) { for (const y in amt) n.v[y] = (n.v[y] || 0) + amt[y]; }
  return root;
}
const ROOTS = { field: buildTree("field"), ministry: buildTree("ministry"), fund: buildTree("fund") };
let ROOT = ROOTS.field;

/* ---------- 검색: 모든 단계의 사업·부처를 한 번에 찾아 그 자리로 이동 ---------- */
let q = "";
const IDX = {};
function searchIndex() {
  if (IDX[view]) return IDX[view];
  const out = [];
  (function walk(n, p) {
    for (const c of n.kids.values()) {
      const np = [...p, c];
      out.push({ name: c.name, sub: c.sub, path: np, v: c.v, leaf: !!c.leaf, hay: (c.name + " " + c.sub).replace(/\s+/g, "").toLowerCase() });
      walk(c, np);
    }
  })(ROOT, []);
  return (IDX[view] = out);
}
function searchHits(text) {
  const key = text.replace(/\s+/g, "").toLowerCase();
  return searchIndex()
    .filter(r => r.v[year] > 0 && r.hay.includes(key))
    .sort((a, b) => b.v[year] - a.v[year]);
}
function drawSearch() {
  const hits = searchHits(q), total = hits.length, shown = hits.slice(0, 60);
  const box = document.createElement("div");
  box.className = "list";
  if (!shown.length) {
    box.innerHTML = `<div class="detail" style="position:static;inset:auto;margin:0"><div class="empty">"${esc(q)}" 와 맞는 사업이 없습니다. 다른 말로 찾아보세요.</div></div>`;
  } else {
    box.innerHTML = shown.map((r, i) => {
      const p = change(r, year), where = r.path.slice(0, -1).map(x => esc(x.name)).join(" › ");
      return `<button class="rowbtn" data-idx="${i}">
        <i class="sw ${cls(p)}"></i>
        <span class="nm">${esc(r.name)}${r.sub ? ` <span style="color:var(--sub);font-weight:400;font-size:11.5px">${esc(r.sub)}</span>` : ""}
          ${where ? `<span class="path">${where}</span>` : ""}</span>
        <span class="am">${money(r.v[year])}<small>${p != null ? pctTxt(p) : ""}</small></span></button>`;
    }).join("") + (total > shown.length ? `<div class="empty" style="margin:8px 12px">${total}건 중 ${shown.length}건만 표시합니다. 검색어를 더 자세히 적어 주세요.</div>` : "");
    box.querySelectorAll(".rowbtn").forEach(b => b.onclick = () => {
      const r = shown[+b.dataset.idx];
      q = ""; $("q").value = ""; $("qclr").hidden = true;
      path = r.path; enterAnim = true; syncUrl(true); render();
    });
  }
  stage.appendChild(box);
}

/* ---------- 내역사업 (선택 자료: data/naeyeok.json) ---------- */
let NAEYEOK = null;
fetch("data/naeyeok.json").then(r => r.ok ? r.json() : null).then(j => { NAEYEOK = j; if (j) render(); }).catch(() => {});

/* ---------- 표시 형식 ---------- */
const num = (n, f = 1) => n.toLocaleString("ko-KR", { maximumFractionDigits: f, minimumFractionDigits: 0 });
const money = v => v == null ? "-" : v >= 10000 ? num(v / 10000) + "조" : v >= 100 ? num(v, 0) + "억" : num(v) + "억";
const pctTxt = p => p == null ? "" : p === Infinity ? "신규" : (p > 0 ? "+" : "") + (Math.abs(p) >= 1000 ? num(p, 0) : p.toFixed(1)) + "%";
function change(n, y) {
  const py = y - 1;
  if (!YEARS.includes(py)) return null;
  const a = n.v[y] || 0, b = n.v[py] || 0;
  if (!(b > 0)) return a > 0 ? Infinity : null;
  return (a / b - 1) * 100;
}
// 색은 그해 총지출 증가율과의 차이 (평균보다 더 늘었나, 덜 늘었나)
function cls(p) {
  if (p == null) return "c-m";
  if (p === Infinity) return "c-u0";
  const avg = change(ROOT, year);
  if (avg == null || !isFinite(avg)) return "c-m";
  const g = p - avg;
  if (g > 20) return "c-u0"; if (g > 10) return "c-u1"; if (g > 3) return "c-u2";
  if (g < -20) return "c-d0"; if (g < -10) return "c-d1"; if (g < -3) return "c-d2";
  return "c-m";
}
const children = (n, y) => [...n.kids.values()].filter(c => c.v[y] > 0).sort((a, b) => b.v[y] - a.v[y]);

/* ---------- 트리맵 배치 (squarified) ---------- */
function squarify(vals, W, H) {
  const tot = vals.reduce((a, b) => a + b, 0), area = vals.map(v => v / tot * W * H), out = [];
  let x = 0, y = 0, w = W, h = H, i = 0;
  const worst = (s, mn, mx, side) => Math.max(side * side * mx / (s * s), s * s / (side * side * mn));
  while (i < area.length) {
    const side = Math.min(w, h);
    let j = i, s = 0, mn = Infinity, mx = 0, best = Infinity;
    while (j < area.length) {
      const a = area[j], s2 = s + a, mn2 = Math.min(mn, a), mx2 = Math.max(mx, a), wst = worst(s2, mn2, mx2, side);
      if (wst > best) break;
      s = s2; mn = mn2; mx = mx2; best = wst; j++;
    }
    if (w >= h) {
      const cw = s / h; let cy = y;
      for (let k = i; k < j; k++) { const ch = area[k] / cw; out.push([x, cy, cw, ch]); cy += ch; }
      x += cw; w -= cw;
    } else {
      const rh = s / w; let cx = x;
      for (let k = i; k < j; k++) { const cw = area[k] / rh; out.push([cx, y, cw, rh]); cx += cw; }
      y += rh; h -= rh;
    }
    i = j;
  }
  return out;
}


/* ---------- 상태: 한 화면에서 한 단계씩 바꿔 보기 ---------- */
let year = YEARS[YEARS.length - 1];
let path = [];                 // ROOT 아래로 내려간 노드들 (분야 → … → 세부사업)
let mode = (() => { try { const m = localStorage.getItem("budgetMapMode"); return m === "list" || m === "tree" ? m : "map"; } catch (e) { return "map"; } })();   // map | list (선택은 기억)
/* ---------- 주소: 연도·기준·단계를 주소에 남긴다 (뒤로가기·새로고침·공유 링크가 같은 화면으로) ---------- */
let pendingJump = null;
const SEG = n => encodeURIComponent(n.name + (n.sub ? "\u0001" + n.sub : ""));
function urlFor() {
  const sp = new URLSearchParams();
  if (year !== YEARS[YEARS.length - 1]) sp.set("y", year);
  if (view !== "field") sp.set("v", view);
  const qs = sp.toString(), seg = path.map(SEG).join("/");
  return location.pathname + (qs ? "?" + qs : "") + (seg ? "#" + seg : "");
}
function syncUrl(push) {
  const n = (history.state && history.state.n) || 0, u = urlFor();
  if (push && u !== location.pathname + location.search + location.hash) history.pushState({ n: n + 1 }, "", u);
  else history.replaceState({ n }, "", u);
}
function restorePath(hash) {
  let node = ROOT; const out = [];
  for (const seg of hash.split("/").filter(Boolean)) {
    const [nm, sub = ""] = decodeURIComponent(seg).split("\u0001");
    const next = [...node.kids.values()].find(k => k.name === nm && k.sub === sub);
    if (!next) break;
    out.push(next); node = next;
  }
  return out;
}
function applyUrl() {
  const sp = new URLSearchParams(location.search);
  view = ["ministry", "fund"].includes(sp.get("v")) ? sp.get("v") : "field"; ROOT = ROOTS[view];

      treeKeep = { top: box.scrollTop, left: box.scrollLeft };   // 지금 보고 있던 세로 위치 (새 칸은 0에서 시작하므로 여기서 이어 간다)
      render();
    } else { enterAnim = false; path = [...path, ...L.rel]; syncUrl(true); render(); }
  };
  // 마우스로 끌면 화면이 같이 움직인다. 살짝 끌어서 생긴 클릭은 무시한다
  let drag = null;
  box.onpointerdown = e => {
    treeTween++;   // 진행 중인 화면 이동은 멈춘다
    if (e.pointerType !== "mouse" || e.button !== 0) return;
    drag = { x: e.clientX, y: e.clientY, l: box.scrollLeft, t: box.scrollTop, moved: false };
    treeSuppress = false;
  };
  box.onpointermove = e => {
    if (!drag) return;
    const dx = e.clientX - drag.x, dy = e.clientY - drag.y;
    if (!drag.moved && Math.abs(dx) + Math.abs(dy) > 5) { drag.moved = true; box.classList.add("dragging"); box.setPointerCapture(e.pointerId); }
    if (drag.moved) { box.scrollLeft = drag.l - dx; box.scrollTop = drag.t - dy; }
  };
  const endDrag = () => {
    if (!drag) return;
    if (drag.moved) treeSuppress = true;
    drag = null; box.classList.remove("dragging");
  };
  box.onpointerup = endDrag;
  box.onpointercancel = endDrag;
  box.onkeydown = e => {
    if (e.key !== "Enter" && e.key !== " ") return;
    const g = e.target.closest && e.target.closest(".tn"); if (!g) return;
    e.preventDefault(); g.querySelector("[data-act]").dispatchEvent(new MouseEvent("click", { bubbles: true }));
  };
  box.onpointerover = e => {                          // 말단에 올리면 루트까지의 계통선만 강조
    const g = e.target.closest && e.target.closest(".tn"); if (!g) return;
    const ids = new Set();
    for (let c = flat[+g.dataset.i]; c; c = c.par) ids.add(c.id);
    svg.classList.add("hl");
    svg.querySelectorAll(".tn").forEach(x => x.classList.toggle("on", ids.has(+x.dataset.i)));
    svg.querySelectorAll(".lk").forEach(x => x.classList.toggle("on", ids.has(+x.dataset.c)));
  };
  svg.onpointerleave = () => { svg.classList.remove("hl"); svg.querySelectorAll(".on").forEach(x => x.classList.remove("on")); };
  stage.appendChild(box);
  // 우측 하단 리셋: 펼친 가지를 모두 접고 처음 모습(총지출 한 줄)으로 되돌린다
  const rb = document.createElement("button");
  rb.className = "tree-reset"; rb.type = "button"; rb.textContent = "리셋"; rb.setAttribute("aria-label", "트리 처음으로 되돌리기");
  rb.onclick = () => { treeOpen.clear(); treeAll.clear(); treeBase = null; treeGhost = null; treeFollow = null; jump(0); };   // 깊이 내려간 상태에서도 최상위(총지출)로 되돌린다
  stage.appendChild(rb);
  if (treeFollow) {   // 펼치면 새로 열린 가지의 가운데, 접으면 접힌 노드가 화면 가운데에 오도록 부드럽게 따라간다
    const f = flat.find(L => L.n === treeFollow && !L.more) || flat[0];
    const H = box.clientHeight, ys = f.kids.map(k => k.y).concat([f.y]);
    const lo = Math.min(...ys), hi = Math.max(...ys), down = (hi - f.y) >= (f.y - lo);
    // 카메라는 새로 펼쳐진 하위 노드들의 가운데에 맞춘다 (접을 때는 접힌 노드 자체가 가운데)
    const ks = f.kids.length ? f.kids : [f];
    const klo = Math.min(...ks.map(k => k.y)), khi = Math.max(...ks.map(k => k.y));
    // 가지가 화면보다 길면 자라는 끝(tip)이 화면 안에 남도록: 아래로 자라면 끝을 아래쪽에, 위로 자라면 위쪽에 둔다
    const want = khi - klo <= H * 0.8 ? (klo + khi) / 2 - H / 2
      : down ? khi - H * 0.7 : klo - H * 0.3;
    // 가로: 하위 노드 열의 가운데가 화면 가운데에 오도록
    const W = box.clientWidth, kidX = ks[0].x;
    // 하위 노드를 가운데에 두되, 부모 노드(왼쪽 라벨 포함)와 새 노드가 모두 화면 안에 남도록 가로 범위를 제한한다
    let wantX = Math.min(kidX - W / 2, f.x - 60);
    wantX = Math.max(wantX, kidX + 40 - W);
    wantX = Math.max(0, Math.min(wantX, box.scrollWidth - W));
    const from = (treeKeep ? treeKeep.top : 0) + shiftDelta, fromX = treeKeep ? treeKeep.left : 0;   // 자라기 전 보던 자리에서 이어서 움직인다
    treeKeep = null;
    treeScrollTween(box, from, Math.max(0, Math.min(want, box.scrollHeight - H)), fromX, wantX);
    treeFollow = null;
  } else {   // 처음에는 트리 전체의 세로 가운데가 화면 가운데에 오도록 (트리가 화면보다 짧으면 위쪽 여백으로 맞춘다)
    const ysAll = flat.map(L => L.y), cc = (Math.min(...ysAll) + Math.max(...ysAll)) / 2, H0 = box.clientHeight;
    treeMargin = Math.max(0, Math.round(H0 / 2 - cc));
    svg.style.marginTop = treeMargin + "px";
    box.scrollTop = Math.max(0, cc + treeMargin - H0 / 2);
  }
}

function drawChildren(parent) {
  const kids = children(parent, year), box = document.createElement("div");
  if (!kids.length) { box.className = "detail"; box.innerHTML = `<div class="empty">표시할 하위 항목이 없습니다.</div>`; stage.appendChild(box); return; }
  const total = parent.v[year];

  if (mode === "list") {
    box.className = "list";
    box.innerHTML = kids.map(k => {
      const p = change(k, year), sh = k.v[year] / total * 100;
      return `<button class="rowbtn" data-idx="${kids.indexOf(k)}">
        <i class="sw ${cls(p)}"></i>
        <span class="nm">${esc(k.name)}${k.sub ? ` <span style="color:var(--sub);font-weight:400;font-size:11.5px">${esc(k.sub)}</span>` : ""}</span>
        <span class="am">${money(k.v[year])}<small>${sh >= 0.1 ? sh.toFixed(1) : "0.1 미만"}%${p != null ? " · " + pctTxt(p) : ""}</small></span>
        <span class="bar"><i style="width:${Math.max(0.5, k.v[year] / kids[0].v[year] * 100)}%"></i></span></button>`;
    }).join("");
    box.querySelectorAll(".rowbtn").forEach(b => b.onclick = () => drill(kids[+b.dataset.idx]));
    stage.appendChild(box);
    return;
  }

  box.className = "map" + (enterAnim ? " enter" : "");
  // 들어갈수록 지도 크기를 15%씩 줄여 가운데에 놓는다 (총지출/부처 = 100%)
  const SW = stage.clientWidth, SH = stage.clientHeight, sc = Math.pow(0.85, path.length);
  const W = SW * sc, H = SH * sc;
  box.style.cssText = `inset:auto;left:${(SW - W) / 2}px;top:${(SH - H) / 2}px;width:${W}px;height:${H}px`;
  // 글자가 안 들어가는 작은 칸이 있으면, 오른쪽 여백에 꺾은선으로 라벨을 붙인다
  const probe = squarify(kids.map(k => k.v[year]), W, H);
  const fits = (w, h) => w >= 44 && h >= 22;
  const hasSmall = probe.some(([, , w, h]) => !fits(w, h));
  const G = hasSmall ? Math.min(112, Math.round(W * 0.28)) : 0, MW = W - G;
  const rects = G ? squarify(kids.map(k => k.v[year]), MW, H) : probe;
  const small = [];
  kids.forEach((k, i) => {
    const [x, y, w, h] = rects[i], p = change(k, year);
    const b = document.createElement("button");
    const big = w > 150 && h > 100;
    b.className = "tile " + cls(p) + (big ? " big" : "") + (w < 22 || h < 18 ? " tiny" : w < 70 || h < 46 ? " mid" : "");
    b.style.cssText = `left:${x}px;top:${y}px;width:${w}px;height:${h}px`;
    b.setAttribute("aria-label", `${k.name}${k.sub ? " " + k.sub : ""} ${money(k.v[year])}원 ${pctTxt(p)}`);
    if (w >= 44 && h >= 22) {
      let html = `<b>${esc(k.name)}</b>`;
      if (h >= 40 && w >= 60) html += `<span>${money(k.v[year])}${w >= 110 && p != null ? " " + pctTxt(p) : ""}</span>`;
      if (h >= 62 && w >= 110 && k.sub) html += `<span>${esc(k.sub)}</span>`;
      b.innerHTML = html;
    }
    // 글자가 없는 작은 칸: 누르면 말풍선, 말풍선을 다시 누르면 들어간다
    if (!fits(w, h)) {
      b.onclick = () => showBubble(k, b, box, W, H);
      small.push({ k, x, y, w, h, el: b });
    } else {
      b.onclick = () => drill(k, b);
    }
    b.style.animationDelay = "0ms"; // 모든 칸이 한꺼번에 나타난다
    box.appendChild(b);
  });

  // 오른쪽 여백의 라벨 (값이 큰 순서로 최대 12개, 칸 위치 순서대로 줄을 맞춘다)
  if (G && small.length) {
    const capAll = Math.max(1, Math.min(12, Math.floor((H - 16) / 34)));
    // 최상위 단계는 꺾은선 라벨을 30% 줄이고, 빠진 작은 칸은 칸 안에 작은 글씨로 이름을 넣는다
    const isTop = path.length === 0;
    const cap = isTop ? Math.max(1, Math.round(Math.min(capAll, small.length) * 0.7)) : capAll;
    const top = [...small].sort((a, b) => b.k.v[year] - a.k.v[year]).slice(0, cap).sort((a, b) => (a.y + a.h / 2) - (b.y + b.h / 2));
    if (isTop) {
      const shown = new Set(top);
      small.forEach(s => { if (!shown.has(s) && s.w >= 26 && s.h >= 14) { s.el.classList.add("mini"); s.el.innerHTML = `<b>${esc(s.k.name)}</b>`; } });
    }
    const NS = "http://www.w3.org/2000/svg";
    const svg = document.createElementNS(NS, "svg");
    svg.setAttribute("class", "lead");
    svg.setAttribute("viewBox", `0 0 ${W} ${H}`);
    const avail = SW - ((SW - W) / 2 + MW + 12) - 4;   // 오른쪽 여백이 남으면 이름을 두 줄로 쓴다
    // 라벨은 해당 칸의 높이에 맞춰 놓고, 겹치면 아래로 밀어낸다 (가운데 정렬 X)
    const items = top.map(c => {
      const cx = c.x + c.w / 2, cy = c.y + c.h / 2, p = change(c.k, year);
      const dot = document.createElement("button");
      dot.className = "callout";
      dot.style.cssText = `left:${MW + 12}px;top:0px;width:${Math.max(G - 16, avail)}px`;
      dot.innerHTML = `<b>${esc(c.k.name)}</b><span>${money(c.k.v[year])}${p != null ? " · " + pctTxt(p) : ""}</span>`;
      dot.onclick = () => drill(c.k);
      box.appendChild(dot);
      return { cx, cy, dot, h: Math.max(30, dot.getBoundingClientRect().height), y: 0 };
    }).sort((p, q) => p.cy - q.cy);
    let y = 0;
    items.forEach(it => { it.y = Math.max(it.cy - it.h / 2, y); y = it.y + it.h + 4; });
    let limit = H;   // 아래로 넘치면 위에서부터 다시 올린다
    for (let i = items.length - 1; i >= 0; i--) { const it = items[i]; it.y = Math.min(it.y, limit - it.h); limit = it.y - 4; }
    items.forEach(it => {
      it.dot.style.top = it.y + "px";
      const line = document.createElementNS(NS, "polyline");
      line.setAttribute("points", `${it.cx},${it.cy} ${MW + 8},${it.y + it.h / 2}`);
      svg.appendChild(line);
    });
    box.insertBefore(svg, box.firstChild);
  }
  stage.appendChild(box);
}

// 작은 칸을 누르면 그 칸 옆에 말풍선으로 이름·금액·증가율을 보여준다
function showBubble(k, tile, box, W, H) {
  box.querySelectorAll(".bubble").forEach(e => e.remove());
  const p = change(k, year);
  const bub = document.createElement("button");
  bub.className = "bubble";
  bub.innerHTML = `<b>${esc(k.name)}</b>${money(k.v[year])}${p != null ? " · " + pctTxt(p) : ""}<br><small style="opacity:.75">한 번 더 누르면 들어가요</small>`;
  const tx = parseFloat(tile.style.left), ty = parseFloat(tile.style.top), tw = parseFloat(tile.style.width);
  bub.style.left = Math.max(4, Math.min(tx + tw + 6, W - 170)) + "px";
  bub.style.top = Math.max(4, Math.min(ty, H - 60)) + "px";
  bub.onclick = e => { e.stopPropagation(); drill(k, tile); };
  box.appendChild(bub);
}

function drawDetail(n) {
  const r = n.raw, box = document.createElement("div");
  box.className = "detail" + (enterAnim ? " enter" : "");
  const rows = YEARS.map(y => {
    const rep = CONFIRMED[y] ? r.na[y] : r.gov[y], mx = Math.max(...YEARS.map(z => Math.max(r.gov[z] || 0, r.na[z] || 0)));
    return `<tr><td>${y}</td><td>${r.gov[y] ? num(r.gov[y]) : "-"}</td><td>${CONFIRMED[y] ? (r.na[y] ? num(r.na[y]) : "-") : "심의 중"}</td>
      <td class="b"><i style="width:${rep > 0 ? Math.max(1, rep / mx * 100) : 0}%"></i></td></tr>`;
  }).join("");
  const key = r.ministry + "|" + n.name, items = NAEYEOK && NAEYEOK[key];
  let inner = `<div class="empty">내역사업 자료는 아직 없습니다. 열린재정 공개 자료는 세부사업까지만 나옵니다. 부처 사업설명자료의 내역사업을 <code>data/naeyeok.json</code>에 넣으면 여기에 펼쳐집니다.</div>`;
  if (items && items.length) {
    const tot = items.reduce((a, b) => a + (b.amt || 0), 0), top = Math.max(...items.map(i => i.amt || 0));
    inner = [...items].sort((a, b) => (b.amt || 0) - (a.amt || 0)).map(i =>
      `<div class="rowbtn go" data-item="${esc(i.name)}" role="button" tabindex="0"><i class="sw c-m"></i><span class="nm">${esc(i.name)}</span>
       <span class="am">${money(i.amt)}<small>${tot > 0 ? (i.amt / tot * 100).toFixed(1) : "-"}%</small></span>
       <span class="bar"><i style="width:${top > 0 ? Math.max(0.5, i.amt / top * 100) : 0}%"></i></span></div>`).join("");
    inner = `<div class="sub-h">내역사업 ${items.length}개</div><div class="items">${inner}</div>`;
  } else {
    inner = `<div class="sub-h">내역사업</div>${inner}`;
  }
  const ch = change(n, year);
  box.innerHTML = `
    <div><div class="dhead"><h2 class="go-title">${esc(n.name)}</h2><button class="dclose" type="button" aria-label="세부사업 닫기">닫기</button></div>
      <div class="meta">${money(n.v[year])}원 (${year}) ${ch != null ? "· 전년 대비 " + pctTxt(ch) : ""}</div></div>
    <dl><dt>소관</dt><dd>${esc(r.ministry)}</dd><dt>회계·기금</dt><dd>${esc(r.fund)}</dd>
      <dt>위치</dt><dd>${path.slice(0, -1).map(p => esc(p.name)).join(" › ")}</dd></dl>
    <table><thead><tr><th>연도</th><th>정부안(억)</th><th>국회 확정(억)</th><th></th></tr></thead><tbody>${rows}</tbody></table>
    ${inner}
    <section class="dcard" id="descCard"><div class="sub-h">사업설명자료</div><div class="dbody"><p class="sub">불러오는 중…</p></div></section>
`;
  const card = box.querySelector("#descCard");
  const goDesc = async hl => {
    const first = await fillDesc(card, r.ministry, n.name, hl);
    box.scrollTo({ top: first ? first.offsetTop - 12 : card.offsetTop - 6, behavior: reduced() ? "auto" : "smooth" });
  };
  box.querySelector(".go-title").onclick = () => goDesc(null);
  box.querySelector(".dclose").onclick = () => jump(path.length - 1);   // 닫기: 한 단계 위(상위 목록)로 돌아간다
  box.querySelectorAll("[data-item]").forEach(el => {
    el.onclick = () => goDesc(el.dataset.item);
    el.onkeydown = e => { if (e.key === "Enter") goDesc(el.dataset.item); };
  });
  stage.appendChild(box);
  fillDesc(card, r.ministry, n.name, null);   // 세부사업에 들어오면 설명자료를 바로 펼친다
}

/* ---------- 사업 설명 (아래에서 올라오는 시트) ---------- */
let DESC_IDX = null;
const gunzipJSON = async url => {
  const res = await fetch(url);
  if (!res.ok) throw new Error("http " + res.status);
  return new Response(res.body.pipeThrough(new DecompressionStream("gzip"))).json();
};
// 줄바꿈: ○ ● ※ 같은 항목 표지와 "/ -" 구분을 줄 시작으로 바꾼다 (긴 한 문단을 읽기 좋게)
const splitLines = s => s
  .replace(/\s*\/\s*(?=-\s)/g, "\n")                                              // "/ - 항목"
  .replace(/\s*\/\s*(?=[○●◎■□※▶①-⑩*]|제\d|\d+[.)]\s|\(\d)/g, "\n")              // "/ ○", "/ 제30조", "/ ②", "/ 2010. 12." (수식의 "/"는 그대로)
  .replace(/\s*([○●◎■□※▶])\s*/g, "\n$1 ")
  .split("\n").map(x => x.trim()).filter(Boolean);
const lineClass = x => /^○/.test(x) ? "o" : /^- /.test(x) ? "li" : "";   // ○ 소소목차(굵게, 윗줄 띄움) · - 항목
const linesHTML = s => splitLines(s).map(x => `<p class="${lineClass(x)}">${esc(x)}</p>`).join("");
const descBlock = b => {
  if (typeof b === "string") {
    const t = b.trim();
    if (/^\d+\.\s*\S/.test(t)) return `<h3>${esc(b)}</h3>`;                         // 1. 사업 총괄 정보
    if (/^\(\d+(-\d+)?\)/.test(t)) return `<h5>${esc(b)}</h5>`;             // (1-1) 소목차 (흰색)
    return /^(\d+\)|[①-⑩])/.test(t) ? `<h4>${esc(b)}</h4>` : linesHTML(b);      // 1) 중목차 (녹색)
  }
  if (b && b.tbl) {
    const rows = b.tbl.filter(r => r.some(c => c && c.trim()));
    if (!rows.length) return "";
    const cellHTML = c => splitLines(c || "").map(x => `<span class="${lineClass(x)}">${esc(x)}</span>`).join("");   // 표 칸 안도 "/ -" 와 ○● 기준으로 줄바꿈
    return `<div class="dtbl"><table>${rows.map((r, i) => `<tr>${r.map(c => i === 0 ? `<th>${esc(c)}</th>` : `<td>${cellHTML(c)}</td>`).join("")}</tr>`).join("")}</table></div>`;
  }
  return "";
};
/* 상세 카드 안의 설명자료: 세부사업명을 누르면 본문, 내역사업명을 누르면 그 항목이 든 곳을 강조 */
const DESC_CACHE = new Map();
async function descRec(ministry, name) {            // undefined: 불러오기 실패(다시 시도), null: 자료 없음
  const key = ministry + "|" + name;
  if (DESC_CACHE.has(key)) return DESC_CACHE.get(key);
  if (!DESC_IDX) DESC_IDX = await fetch("desc/index.json").then(r => r.ok ? r.json() : Promise.reject()).catch(() => null);
  if (!DESC_IDX) return undefined;
  const id = DESC_IDX[key];
  if (!id) { DESC_CACHE.set(key, null); return null; }
  const rec = await gunzipJSON(`desc/${id}.json.gz`).catch(() => undefined);
  if (rec !== undefined) DESC_CACHE.set(key, rec);
  return rec;
}
const blockText = b => typeof b === "string" ? b : (b && b.tbl ? b.tbl.flat().filter(Boolean).join(" ") : "");
const squash = t => String(t).replace(/\s+/g, "");
async function fillDesc(card, ministry, name, hl) {
  const body = card.querySelector(".dbody");
  const rec = await descRec(ministry, name);
  if (!card.isConnected) return null;
  if (rec === undefined) { body.innerHTML = `<p class="sub">설명을 불러오지 못했습니다. 다시 눌러 주세요.</p>`; return null; }
  if (!rec) { body.innerHTML = `<p class="sub">이 사업의 설명 자료가 아직 없습니다.</p>`; return null; }
  const parts = Array.isArray(rec.blocks) && rec.blocks.length && rec.blocks[0] && rec.blocks[0].file
    ? rec.blocks.map(x => ({ file: x.file, b: x.b }))
    : [{ file: null, b: rec.blocks }];
  const key = hl ? squash(hl) : "";
  let first = true;
  body.innerHTML = parts.map(pt => `<div class="part">${pt.file ? `<div class="sub">${esc(pt.file)}</div>` : ""}${(pt.b || []).map(b => {
    const html = descBlock(b);
    if (!key || !squash(blockText(b)).includes(key)) return html;
    const attr = first ? ' data-first="1"' : ""; first = false;
    return `<div class="hit"${attr}>${html}</div>`;
  }).join("")}</div>`).join("");
  return body.querySelector("[data-first]");
}
async function openDesc(ministry, name) {
  let sheet = document.getElementById("sheet");
  if (!sheet) {
    sheet = document.createElement("div");
    sheet.id = "sheet"; sheet.className = "sheet";
    sheet.innerHTML = `<div class="sheet-bar"><b id="sheetTitle"></b><button id="sheetClose" aria-label="닫기">닫기</button></div><div class="sheet-body" id="sheetBody"></div>`;
    document.body.appendChild(sheet);
    $("sheetClose").onclick = () => sheet.classList.remove("on");
  }
  $("sheetTitle").textContent = name;
  $("sheetBody").innerHTML = `<p class="sub">불러오는 중…</p>`;
  sheet.classList.add("on");
  try {
    if (!DESC_IDX) DESC_IDX = await fetch("desc/index.json").then(r => r.json());
    const id = DESC_IDX[ministry + "|" + name];
    if (!id) { $("sheetBody").innerHTML = `<p class="sub">이 사업의 설명 자료가 아직 없습니다.</p>`; return; }
    const rec = await gunzipJSON(`desc/${id}.json.gz`);
    const parts = Array.isArray(rec.blocks) && rec.blocks.length && rec.blocks[0] && rec.blocks[0].file
      ? rec.blocks.map(x => `<div class="part"><div class="sub">${esc(x.file)}</div>${x.b.map(descBlock).join("")}</div>`)
      : [rec.blocks.map(descBlock).join("")];
    $("sheetBody").innerHTML = `<div class="sub">${esc(rec.ministry)} · 2027 정부안 사업설명자료</div>${parts.join("")}`;
  } catch (e) {
    $("sheetBody").innerHTML = `<p class="sub">설명을 불러오지 못했습니다. 잠시 후 다시 눌러 주세요.</p>`;
  }
}

/* ---------- 이벤트 ---------- */
$("q").oninput = e => { q = e.target.value.trim(); $("qclr").hidden = !e.target.value; render(); };
$("q").onkeydown = e => { if (e.key === "Escape") { e.target.value = ""; q = ""; $("qclr").hidden = true; render(); } };
$("qclr").onclick = () => { $("q").value = ""; q = ""; $("qclr").hidden = true; render(); $("q").focus(); };
$("years").onclick = e => { const b = e.target.closest("button"); if (b) setYear(+b.dataset.y); };
$("back").onclick = () => { if (path.length) jump(path.length - 1); };
$("trail").onclick = e => { const b = e.target.closest("button"); if (b && b.dataset.i != null) jump(+b.dataset.i); };
$("tabField").onclick = () => setView("field");      // 이미 보고 있던 기준을 누르면 맨 처음으로
$("tabMin").onclick = () => setView("ministry");
$("tabFund").onclick = () => setView("fund");
addEventListener("popstate", () => {
  const want = pendingJump; pendingJump = null;
  applyUrl();
  if (want && !(path.length === want.length && path.every((n, i) => n === want[i]))) { path = want; syncUrl(true); }
  enterAnim = true; render();
});
$("vMap").onclick = () => { setMode("map"); enterAnim = true; render(); };
$("vTree").onclick = () => { setMode("tree"); enterAnim = false; render(); };
$("vList").onclick = () => { setMode("list"); enterAnim = true; render(); };

// 화면 크기가 바뀌면 지도를 다시 짠다
let rt = null, lastW = innerWidth, lastH = innerHeight;
addEventListener("resize", () => {
  if (innerWidth === lastW && innerHeight === lastH) return;
  lastW = innerWidth; lastH = innerHeight;
  clearTimeout(rt); rt = setTimeout(render, 120);
});
applyUrl(); syncUrl(false);
/* 아래로 당겨 새로고침: 지도는 고정 화면이라 브라우저 기본 기능이 없어 직접 처리. 위치는 주소에 있어 그대로 돌아간다 */
(() => {
  const ptr = document.createElement("div"); ptr.id = "ptr"; ptr.textContent = "↓ 당겨서 새로고침"; document.body.appendChild(ptr);
  const listTop = () => { if (document.querySelector("#stage .tree")) return false; const l = document.querySelector("#stage .list, #stage .detail .items"); return !l || l.scrollTop <= 0; };   // 트리에서는 끌기·스크롤이 새로고침으로 이어지지 않게
  let y0 = null, armed = false;
  addEventListener("touchstart", e => { y0 = e.touches.length === 1 && listTop() ? e.touches[0].clientY : null; armed = false; }, { passive: true });
  addEventListener("touchmove", e => {
    if (y0 == null) return;
    const dy = e.touches[0].clientY - y0;
    if (dy < 0) { y0 = null; ptr.classList.remove("on"); return; }
    armed = dy > 90;
    ptr.classList.toggle("on", dy > 24);
    ptr.textContent = armed ? "놓으면 새로고침" : "↓ 당겨서 새로고침";
  }, { passive: true });
  addEventListener("touchend", () => { if (armed) location.reload(); ptr.classList.remove("on"); y0 = null; armed = false; }, { passive: true });
})();
render();
</script>
