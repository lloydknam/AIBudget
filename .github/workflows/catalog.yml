name: 열린재정 통계 그래프 자료 갱신

on:
  schedule:
    - cron: "17 20 * * 2"   # 매주 수요일 05:17 KST
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 수집·요약
        run: python scripts/build_api_charts.py
      - name: 커밋
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add data/fiscal/catalog
          git diff --cached --quiet && echo "변경 없음" && exit 0
          git commit -m "열린재정 통계 그래프 자료 갱신"
          git pull --rebase
          git push
