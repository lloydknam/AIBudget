name: 예산 데이터 수집

on:
  workflow_dispatch:
    inputs:
      year:
        description: "정부안 연도 (직전 연도와 함께 수집)"
        required: false
        default: "2027"

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 열린재정에서 수집
        env:
          OPENFISCAL_KEY: ${{ secrets.OPENFISCAL_KEY }}
        run: |
          if [ -z "$OPENFISCAL_KEY" ]; then
            echo "OPENFISCAL_KEY 비밀값이 없습니다."; exit 1
          fi
          python scripts/fetch_openfiscal.py --year "${{ inputs.year }}"
          python scripts/build.py

      - name: 변경분 커밋
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add data/budget.json data/budget.js
          if git diff --cached --quiet; then
            echo "변경 없음"
          else
            git commit -m "data: collect open fiscal budget (${{ inputs.year }})"
            git push
          fi
