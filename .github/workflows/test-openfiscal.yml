name: 열린재정 인증키 확인

on:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 키 확인
        env:
          OPENFISCAL_KEY: ${{ secrets.OPENFISCAL_KEY }}
          DATA_GO_KR_KEY: ${{ secrets.DATA_GO_KR_KEY }}
        run: python scripts/test_openfiscal_key.py
