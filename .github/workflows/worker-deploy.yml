name: Worker 배포 (AI분석 중계 서버)

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "worker/ai-proxy.js"
      - "worker/wrangler.toml"

concurrency:
  group: worker-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Cloudflare 토큰 확인
        id: chk
        env:
          TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -z "$TOKEN" ]; then
            echo "::warning::CLOUDFLARE_API_TOKEN Secret이 없어 배포를 건너뜁니다. worker/README.md의 '버튼 배포' 순서를 참고하세요."
            echo "ok=false" >> "$GITHUB_OUTPUT"
          else
            echo "ok=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v4
        if: steps.chk.outputs.ok == 'true'
      - uses: actions/setup-node@v4
        if: steps.chk.outputs.ok == 'true'
        with:
          node-version: 22
      - name: wrangler deploy
        if: steps.chk.outputs.ok == 'true'
        working-directory: worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4 deploy
      - name: 배포 확인 (허용 사이트 아닌 호출은 403이어야 정상)
        if: steps.chk.outputs.ok == 'true'
        run: |
          code=$(curl -s -o /dev/null -w "%{http_code}" -X POST https://aibudget-ai.lloydnam.workers.dev/ask -H "Content-Type: application/json" -d '{"q":"t"}')
          echo "응답 코드: $code"
          [ "$code" = "403" ]
