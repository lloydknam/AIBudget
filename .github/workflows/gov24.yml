name: 정부24 공공서비스 수집

on:
  schedule:
    - cron: "17 18 * * 0"   # 매주 월요일 03:17 KST
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 수집
        env:
          DATA_GO_KR_KEY: ${{ secrets.DATA_GO_KR_KEY }}
        run: python scripts/fetch_gov24.py
      - name: 복지로 중앙부처 복지서비스 목록
        continue-on-error: true
        env:
          DATA_GO_KR_KEY: ${{ secrets.DATA_GO_KR_KEY }}
        run: python scripts/fetch_bokjiro.py
      - name: 예산 사업 매칭
        run: python scripts/match_gov24.py
      - name: 국민혜택 화면 자료
        run: python scripts/build_benefits.py
      - name: 커밋
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add data/gov24.json data/benefit_map.json data/benefit_review.csv data/benefits.json
          if [ -f data/bokjiro.json ]; then git add data/bokjiro.json; fi
          git diff --cached --quiet && echo "변경 없음" && exit 0
          git commit -m "정부24 공공서비스 자료 갱신"
          git push
