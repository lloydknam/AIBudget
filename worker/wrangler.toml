# 클사무관의 예산 프리즘 · AI분석 Worker 배포 설정 (GitHub Actions "Worker 배포"에서 사용)
name = "aibudget-ai"
main = "ai-proxy.js"
compatibility_date = "2026-11-01"
workers_dev = true
# 대시보드에 등록한 환경변수(GEMINI_MODEL 등)를 배포할 때 지우지 않고 유지한다. Secret은 원래 유지된다.
keep_vars = true

# 서울(GCP asia-northeast3) 근처에서 실행 — 기본 배치에서는 Gemini "User location is not supported" 오류가 났다.
[placement]
region = "gcp:asia-northeast3"
